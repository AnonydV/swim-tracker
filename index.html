<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Half Ironman — Tracker Triathlon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07090f; color: #e2eaf4; font-family: system-ui, sans-serif; }
  .loading { text-align: center; line-height: 1.6; }
  .loading strong { color: #38bdf8; }
</style>
</head>
<body>
<div class="loading"><strong>HIPLAN</strong><br>Chargement du tracker...</div>
<script>
const PREVIOUS_LOADER_BLOB_URL = 'https://api.github.com/repos/AnonydV/swim-tracker/git/blobs/664bd3d8ec48572ce6bfc8f704fbcdf8a576aa6e';
const RUNTIME_SCRIPT = '<script src="calendar-runtime.js?v=b9244bbfe5ffb4cfabddf190d87295498fd82f04"></scr' + 'ipt>';

function decodeBase64Utf8(base64) {
  const binary = atob(base64.replace(/\n/g, ''));
  const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

fetch(PREVIOUS_LOADER_BLOB_URL)
  .then(response => {
    if (!response.ok) throw new Error('Impossible de charger le loader précédent');
    return response.json();
  })
  .then(blob => decodeBase64Utf8(blob.content))
  .then(loaderHtml => loaderHtml.replace('document.write(html);', "document.write(html.replace('</body>', '" + RUNTIME_SCRIPT + "</body>'));"))
  .then(loaderHtml => {
    document.open();
    document.write(loaderHtml);
    document.close();
  })
  .catch(error => {
    document.body.innerHTML = '<div class="loading"><strong>Erreur de chargement</strong><br>' + error.message + '</div>';
  });
</script>
</body>
</html>
