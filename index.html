<!DOCTYPE html>
<html lang="fr">
<head>

<title>Half Ironman — Tracker Triathlon</title>
<style>

  .loading { text-align: center; line-height: 1.6; }
  .loading strong { color: #38bdf8; }
</style>
</head>
<body>
<div class="loading"><strong>HIPLAN</strong><br>Chargement du tracker...</div>
<script>
const SOURCE_BLOB_URL = 'https://api.github.com/repos/AnonydV/swim-tracker/git/blobs/dd0c20031f79c33b6e2756ca6f6691041f35bc1c';

function decodeBase64Utf8(base64) {
  const binary = atob(base64.replace(/\n/g, ''));
  const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function patchAfter(source, marker, addition) {
  return source.includes(marker) ? source.replace(marker, marker + addition) : source;
}

function deployPatches(html) {
  html = html.replace('<title>Half Ironman — Tracker Natation</title>', '<title>Half Ironman — Tracker Triathlon</title>');
  html = html.replace('// TRACKER NATATION · 13 SEMAINES', '// TRACKER TRIATHLON · 13 SEMAINES');
  html = html.replace('IRONMAN 70.3 NICE — 28 JUIN 2025', 'IRONMAN 70.3 NICE — 28 JUIN 2026');
  html = html.replaceAll('font-size:18px margin-bottom:4px', 'font-size:18px; margin-bottom:4px');

  html = html.replace('42–48 min', '45–55 min');
  html = html.replace('Mer Méditerranée<br>Eau ~23°C — sans combi si >24°C', 'Départ calme · sighting régulier<br>Objectif : sortir frais, pas vite');
  html = html.replace('2h35–2h45', '3h20–3h40');
  html = html.replace('Col de Vence km 26<br>9,7 km à 6,6% · max 170W en montée', 'Col de Vence km 26<br>9,7 km à 6,6% · plafond 160–165W');
  html = html.replace('1h52–2h02', '2h05–2h20');
  html = html.replace('Promenade des Anglais<br>2 boucles · ravito tous les 1,7 km', 'Promenade des Anglais<br>Départ contrôlé · ravito tous les 1,7 km');
  html = html.replace('5h15–5h30', '6h25–7h05');
  html = html.replace('Transitions ~5 min<br>Limit : 10h45', 'Transitions ~10 min<br>Objectif : finir solide');
  html = html.replace('⚠️ Stratégie Col de Vence :', '⚠️ Stratégie prudente Col de Vence :');
  html = html.replace('Rester à <span style="color:#facc15">155–165W</span> avant le col (km 0–26).', 'Rester à <span style="color:#facc15">135–150W</span> avant le col (km 0–26).');
  html = html.replace('Dans la montée : plafonner à <span style="color:#facc15">170W max</span> — dépasser ce seuil coûte le run.', 'Dans la montée : plafonner à <span style="color:#facc15">160–165W max</span> — le but est de protéger le semi.');
  html = html.replace("Sur le run : partir à <span style=\"color:#a3e635\">5'30/km</span> les 3 premiers km, puis installer ton allure cible <span style=\"color:#a3e635\">5'20–5'30/km</span>.", "Sur le run : partir à <span style=\"color:#a3e635\">6'15–6'30/km</span> les 3 premiers km, puis stabiliser autour de <span style=\"color:#a3e635\">6'00–6'20/km</span> si les jambes répondent.");

  html = patchAfter(html, `.week-title {\n  font-weight: 600;\n  font-size: 15px;\n  flex: 1;\n}\n`, `.week-title-block { flex: 1; min-width: 0; }\n.week-date {\n  font-size: 11px;\n  color: var(--muted2);\n  font-family: 'JetBrains Mono', monospace;\n  margin-top: 2px;\n}\n`);
  html = html.replace('@media(max-width:600px){ .stats-bar { grid-template-columns: repeat(3,1fr); } }', `@media(max-width:600px){ .stats-bar { grid-template-columns: repeat(3,1fr); } }\n@media(max-width:480px){\n  .stats-bar { grid-template-columns: repeat(2,1fr); }\n  .stat-box { padding: 12px 10px; }\n  .stat-box .val { font-size: 24px; }\n  .stat-box .lbl { font-size: 10px; }\n}`);
  html = html.replace(`.sport-tab {\n  display: flex;\n  gap: 8px;`, `.sport-tab {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;`);
  html = patchAfter(html, `.sport-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }\n`, `.sport-btn:focus-visible,\n.week-nav-btn:focus-visible,\n.check-btn:focus-visible,\n.uncheck-btn:focus-visible,\n.skip-btn:focus-visible,\n.unskip-btn:focus-visible,\n.wsc-btn:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n`);

  html = html.replace(`" onclick="toggleObjectives()">`, `" role="button" tabindex="0" aria-expanded="false" onclick="toggleObjectives()" onkeydown="handleObjectivesKey(event)">`);
  html = html.replace(`const STORAGE_KEY = 'hi_swim_tracker_v3';\nlet completed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');\nconst SKIP_KEY = 'hi_swim_skipped_v1';\nlet skipped = JSON.parse(localStorage.getItem(SKIP_KEY) || '{}');`, `const STORAGE_KEY = 'hi_swim_tracker_v3';\nconst SKIP_KEY = 'hi_swim_skipped_v1';\n\nfunction loadStoredState(key) {\n  try {\n    const value = JSON.parse(localStorage.getItem(key) || '{}');\n    return value && typeof value === 'object' && !Array.isArray(value) ? value : {};\n  } catch {\n    localStorage.removeItem(key);\n    return {};\n  }\n}\n\nlet completed = loadStoredState(STORAGE_KEY);\nlet skipped = loadStoredState(SKIP_KEY);`);

  html = patchAfter(html, `let currentSport = 'swim';\nlet currentWeekView = null; // null = auto (active week)\n`, `const RACE_DATE = new Date(2026, 5, 28);\nconst RACE_WEEK_START = new Date(2026, 5, 22);\nconst TOTAL_WEEKS = 13;\n\nfunction addDays(date, days) {\n  const result = new Date(date);\n  result.setDate(result.getDate() + days);\n  return result;\n}\n\nfunction formatDateShort(date) {\n  return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }).replace('.', '');\n}\n\nfunction getWeekDateRange(weekNum) {\n  const start = addDays(RACE_WEEK_START, (weekNum - TOTAL_WEEKS) * 7);\n  const end = weekNum === TOTAL_WEEKS ? RACE_DATE : addDays(start, 6);\n  return \`${'${'}formatDateShort(start)} – ${'${'}formatDateShort(end)}\`;\n}\n`);
  html = html.replace(`const isActive = weekNum === getWeekActiveNum();`, `const isActive = weekNum === getWeekActiveNum();\n  const weekDateRange = getWeekDateRange(weekNum);`);
  html = html.replace(`<span>${'${'}isActive ? '📍 SEMAINE EN COURS' : ''}</span>`, `<span>${'${'}weekDateRange}${'${'}isActive ? ' · 📍 SEMAINE EN COURS' : ''}</span>`);
  html = html.replace(`const weekDone = doneSessions === totalSessions;`, `const weekDone = doneSessions === totalSessions;\n  const weekDateRange = getWeekDateRange(week.num);`);
  html = html.replace(`<div class="week-header" onclick="toggleWeek(${'${'}week.num})">`, `<div class="week-header" role="button" tabindex="0" aria-expanded="false" onclick="toggleWeek(${'${'}week.num})" onkeydown="handleWeekKey(event, ${'${'}week.num})">`);
  html = html.replace(`<div>\n        <div class="week-title">${'${'}week.title}</div>\n        <div class="week-focus">${'${'}week.focus}</div>\n      </div>`, `<div class="week-title-block">\n        <div class="week-title">${'${'}week.title}</div>\n        <div class="week-focus">${'${'}week.focus}</div>\n        <div class="week-date">${'${'}weekDateRange}</div>\n      </div>`);
  html = html.replaceAll(`<div class="session-top" onclick="toggleSession('${'${'}s.id}')">`, `<div class="session-top" role="button" tabindex="0" aria-expanded="false" onclick="toggleSession('${'${'}s.id}')" onkeydown="handleSessionKey(event, '${'${'}s.id}')">`);

  html = html.replace(`function toggleWeek(num) {\n  const block = document.getElementById(\`week-${'${'}num}\`);\n  block.classList.toggle('open');\n}\n\nfunction toggleSession(id) {\n  const card = document.getElementById(\`card-${'${'}id}\`);\n  card.classList.toggle('open');\n}`, `function toggleWeek(num) {\n  const block = document.getElementById(\`week-${'${'}num}\`);\n  block.classList.toggle('open');\n  block.querySelector('.week-header')?.setAttribute('aria-expanded', block.classList.contains('open'));\n}\n\nfunction toggleSession(id) {\n  const card = document.getElementById(\`card-${'${'}id}\`);\n  card.classList.toggle('open');\n  card.querySelector('.session-top')?.setAttribute('aria-expanded', card.classList.contains('open'));\n}\n\nfunction openWeekElement(block) {\n  block?.classList.add('open');\n  block?.querySelector('.week-header')?.setAttribute('aria-expanded', 'true');\n}\n\nfunction openSessionElement(card) {\n  card?.classList.add('open');\n  card?.querySelector('.session-top')?.setAttribute('aria-expanded', 'true');\n}\n\nfunction handleWeekKey(event, num) {\n  if (event.key !== 'Enter' && event.key !== ' ') return;\n  event.preventDefault();\n  toggleWeek(num);\n}\n\nfunction handleSessionKey(event, id) {\n  if (event.key !== 'Enter' && event.key !== ' ') return;\n  event.preventDefault();\n  toggleSession(id);\n}`);
  html = html.replace(`buildPlan();\n  showToast(skipped[id] ? 'skip' : 'unskip');`, `buildPlan();\n  addActiveWeekIndicator();\n  showToast(skipped[id] ? 'skip' : 'unskip');`);
  html = html.replace(`buildPlan();\n  showToast(completed[id] ? true : false);`, `buildPlan();\n  addActiveWeekIndicator();\n  showToast(completed[id] ? true : false);`);
  html = html.replaceAll(`document.getElementById(wId)?.classList.add('open')`, `openWeekElement(document.getElementById(wId))`);
  html = html.replaceAll(`document.getElementById(weekId)?.classList.add('open')`, `openWeekElement(document.getElementById(weekId))`);
  html = html.replaceAll(`document.getElementById(cId)?.classList.add('open')`, `openSessionElement(document.getElementById(cId))`);
  html = html.replaceAll(`document.getElementById(cardId)?.classList.add('open')`, `openSessionElement(document.getElementById(cardId))`);
  html = html.replaceAll(`document.getElementById(\`card-${'${'}id}\`)?.classList.add('open')`, `openSessionElement(document.getElementById(\`card-${'${'}id}\`))`);
  html = html.replaceAll(`if (weekBlock) weekBlock.classList.add('open');`, `openWeekElement(weekBlock);`);
  html = html.replaceAll(`card.classList.add('open');`, `openSessionElement(card);`);
  html = html.replaceAll(`block.classList.add('open');`, `openWeekElement(block);`);
  html = html.replace(`function toggleObjectives() {\n  const body = document.getElementById('obj-body');\n  const chevron = document.getElementById('obj-chevron');\n  const isOpen = body.style.display !== 'none';\n  body.style.display = isOpen ? 'none' : 'block';\n  chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';\n}`, `function toggleObjectives() {\n  const body = document.getElementById('obj-body');\n  const chevron = document.getElementById('obj-chevron');\n  const isOpen = body.style.display !== 'none';\n  body.style.display = isOpen ? 'none' : 'block';\n  chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';\n  document.querySelector('#objectives-section [role="button"]')?.setAttribute('aria-expanded', !isOpen);\n}\n\nfunction handleObjectivesKey(event) {\n  if (event.key !== 'Enter' && event.key !== ' ') return;\n  event.preventDefault();\n  toggleObjectives();\n}`);

  const replacements = [
    [`Tu reprends normalement donc on attaque direct avec de la qualité. Le seuil reconstruit ta capacité à courir vite longtemps — indispensable pour tenir < 1h50 sur le 21 km du half.`, `Tu reprends normalement donc on attaque avec de la qualité. Le seuil reconstruit ta marge d'aisance : plus tu es solide à frais, plus tu peux courir proprement autour de 6'00–6'20/km après le vélo.`],
    [`Sortie longue — allure 5'15–5'30/km`, `Sortie longue — allure 5'35–6'00/km`],
    [`22 km. Tu dépasses la distance course du half. Allure stable et confortable. Sur les 4 derniers km, essaie de maintenir l'allure même si tu commences à sentir la fatigue — c'est l'entraînement de résistance à la fatigue.`, `22 km. Tu dépasses la distance course du half. Allure stable et confortable. Sur les 4 derniers km, maintiens la technique sans forcer — c'est l'entraînement de résistance à la fatigue.`],
    [`Sortie longue — allure 5'15–5'30/km`, `Sortie longue — allure 5'35–6'05/km`],
    [`23 km. Pic de distance du programme. Sur les 5 derniers km, essaie de courir à ~5'15/km si tu en as encore sous le pied. Simule la fin de course du half.`, `23 km. Pic de distance du programme. Sur les 5 derniers km, reste relâché et régulier. Le but est de finir solide, pas de chercher un chrono à l'entraînement.`],
    [`5 km à allure 5'15–5'30/km — installation`, `5 km à allure 5'45–6'00/km — installation`],
    [`12 km à allure race — 5'05–5'15/km`, `12 km à allure half prudente — 5'45–6'05/km`],
    [`Ton allure cible pour le 21 km du half (objectif 1h50–2h00). Après la nage et le vélo tu seras plus lent — mais entraîner cette allure à frais est indispensable.`, `Travail d'allure contrôlée à frais. Le jour J, après la nage et le vélo, l'objectif sera plutôt 6'00–6'20/km selon les sensations.`],
    [`12 km à allure race au milieu d'une sortie de 22 km — c'est la simulation la plus proche du half en terme de gestion de l'effort.`, `12 km à allure half prudente au milieu d'une sortie de 22 km — c'est une simulation de gestion, pas un test chrono.`],
    [`Sortie légère — allure 5'15–5'30/km`, `Sortie légère — allure 5'45–6'10/km`],
    [`12 km très confortable. Quelques accélérations à allure race sur 3–4 × 1 km en milieu de sortie pour rester affûté.`, `12 km très confortable. Quelques accélérations souples sur 3–4 × 1 km en milieu de sortie pour rester affûté, sans fatigue.`],
    [`Endurance Z2 avec 2×15 min en Z3 — 160–185W`, `Endurance Z2 avec 2×15 min tempo — 150–165W`],
    [`2h30. Sur les 120 min de travail : 45 min Z2 → 15 min Z3 → 30 min Z2 → 15 min Z3 → 15 min Z2. Simule les efforts dans les côtes du half.`, `2h30. Sur les 120 min de travail : 45 min Z2 → 15 min tempo → 30 min Z2 → 15 min tempo → 15 min Z2. Simule les côtes du half sans te mettre dans le rouge.`],
    [`Endurance Z2 avec blocs Z3 — simulation half`, `Endurance Z2 avec blocs tempo — simulation half prudente`],
    [`3h. Structure : 30 min Z2 → 20 min Z3 (160–185W) → 30 min Z2 → 20 min Z3 → 50 min Z2. C'est la puissance que tu devras tenir sur les ondulations du half. Mange et bois régulièrement.`, `3h. Structure : 30 min Z2 → 20 min tempo (150–165W) → 30 min Z2 → 20 min tempo → 50 min Z2. C'est une simulation de gestion, pas un test de puissance. Mange et bois régulièrement.`],
    [`Simulation race — allure race 157–164W de moyenne`, `Simulation race prudente — 145–155W de moyenne`],
    [`C'est TA simulation du half. 90 km à allure race soit 157–164W de moyenne (75–78% FTP). Gère-toi pour arriver au bout avec encore de l'énergie — ne dépasse pas 185W sauf côtes courtes. Mange et bois comme si c'était la course réelle.`, `C'est TA simulation du half. 90 km à allure contrôlée. Gère-toi pour arriver au bout avec encore de l'énergie — plafond 160–165W dans les côtes longues. Mange et bois comme si c'était la course réelle.`],
    [`⭐ Séance clé du programme. Si tu termines 90 km à 157–164W de moyenne sans être épuisé, tu es prêt pour le half. Note ta puissance normalisée et tes sensations à l'arrivée.`, `⭐ Séance clé du programme. Si tu termines 90 km à 145–155W de moyenne sans être épuisé, tu es prêt pour un half maîtrisé. Note ta puissance normalisée et tes sensations à l'arrivée.`],
    [`Endurance Z2 avec 2×20 min allure race — 157–164W`, `Endurance Z2 avec 2×20 min allure race prudente — 145–155W`],
    [`3h. Structure : 30 min Z2 → 20 min allure race → 30 min Z2 → 20 min allure race → 50 min Z2. Affine ta gestion de l'allure race après les longues sorties précédentes.`, `3h. Structure : 30 min Z2 → 20 min allure prudente → 30 min Z2 → 20 min allure prudente → 50 min Z2. Affine ta gestion sans entamer le run.`],
    [`4 fois 1 min à allure race — 157–164W — 2 min récup`, `4 fois 1 min à allure race prudente — 145–155W — 2 min récup`],
    [`Les 5 premiers km — PRUDENCE", tip:"Tu sors de 90 km de vélo. Les jambes vont sembler de plomb les 500 premiers mètres — c'est normal, ça passe. Pars à ~5'30/km, pas à ton allure cible. Laisse 3–4 km pour trouver ton rythme.`, `Les 5 premiers km — PRUDENCE", tip:"Tu sors de 90 km de vélo. Pars à 6'15–6'30/km, même si tu te sens bien. Laisse 3–4 km pour trouver ton rythme et vérifier que le ventre accepte les ravitos.`],
    [`Corps de la course — allure race 5'05–5'15/km`, `Corps de la course — allure prudente 6'00–6'20/km`],
    [`Une fois les jambes revenues, installe ton allure cible. Gère-toi : le half ironman se gagne sur les 5 derniers km du run, pas au départ.`, `Installe une allure contrôlée. Si la natation ou le vélo ont coûté cher, reste proche de 6'20/km. Le half se réussit en restant lucide jusqu'au dernier tour.`],
    [`Accélération finale si possible`, `Maintien ou progression légère`],
    [`Si tu as encore du jus sur les 3 derniers km, c'est le moment de tout donner. Sinon, maintiens l'allure. Pas de regret dans les deux cas.`, `Si tu as encore du jus sur les 3 derniers km, accélère progressivement. Sinon, maintiens proprement l'allure sans te crisper.`],
    [`Les 15 premiers km — installation progressive`, `Les 15 premiers km — installation très progressive`],
    [`Pars prudent. Ne dépasse pas 160W les 10 premiers km même si tu te sens bien. Laisse le corps se stabiliser après la nage et la T1.`, `Pars prudent. Reste autour de 130–145W les 10 premiers km même si tu te sens bien. Laisse le corps se stabiliser après la nage et la T1.`],
    [`Corps du vélo — allure race 157–164W de moyenne`, `Corps du vélo — allure prudente 145–155W de moyenne`],
    [`Ton allure cible. Gère par blocs de 20 km. Dans les côtes : max 185W. En descente : récupère. Mange toutes les 30–35 min, bois toutes les 15 min. Pense à tes jambes sur le run.`, `Ton objectif est de rentrer à Nice avec des jambes. Gère par blocs de 20 km. Dans les côtes : plafond 160–165W sauf micro-relances. En descente : récupère. Mange toutes les 30–35 min, bois toutes les 15 min.`],
    [`Légèrement sous allure race (145–155W). Prépare la transition. Mange un dernier gel à 10 km de l'arrivée.`, `Légèrement sous allure race (135–145W). Prépare la transition. Mange un dernier gel à 10 km de l'arrivée.`],
    [`⚠️ Rappels : ne jamais dépasser 185W sur les 60 premiers km · Gel toutes les 30 min · Boire toutes les 15 min · Position race dès le départ · Penser aux jambes du run !`, `⚠️ Rappels : plafond 160–165W dans le Col de Vence · Gel toutes les 30 min · Boire toutes les 15 min · Le vélo doit te livrer au semi, pas te prouver que tu es fort.`]
  ];
  replacements.forEach(([from, to]) => { html = html.replace(from, to); });

  return html;
}

fetch(SOURCE_BLOB_URL)
  .then(response => {
    if (!response.ok) throw new Error('Impossible de charger la page source');
    return response.json();
  })
  .then(blob => decodeBase64Utf8(blob.content))
  .then(deployPatches)
  .then(html => {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(error => {
    document.body.innerHTML = '<div class="loading"><strong>Erreur de chargement</strong><br>' + error.message + '</div>';
  });
</script>
</body>
</html>
