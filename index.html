function formatSecondsToMMSS(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = Math.round(totalSeconds % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function exportCoachReport() {
  const activeWeekNum = getCalendarActiveWeekNum();

  // En-tête
  const todayDate = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const phaseName = WEEK_PHASES.find(p => p.weeks.includes(activeWeekNum))?.name || '';
  const raceDate = getRaceDate();
  const raceDateStr = raceDate ? raceDate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'à définir';
  const today = startOfToday();
  const diffJours = raceDate ? Math.round((raceDate - today) / 86_400_000) : null;
  const weeksLeft = RACE_WEEK - activeWeekNum;
  const weeksLeftStr = weeksLeft <= 0 ? 'Semaine de course' : weeksLeft + ' semaine(s) avant course';

  let md = '';
  md += '# HIPLAN — Rapport Coach\n';
  md += '**Généré le:** ' + todayDate + '\n';
  md += '**Semaine active:** S' + activeWeekNum + ' — ' + phaseName + '\n';
  md += '**Date de course:** ' + raceDateStr + (diffJours !== null ? ' (J-' + diffJours + ')' : '') + '\n';
  md += '**Semaines restantes:** ' + weeksLeftStr + '\n\n';

  // Sections par semaine
  const maxWeek = Math.min(activeWeekNum, TOTAL_WEEKS);
  for (let n = 1; n <= maxWeek; n++) {
    const sessions = (weeklyPlan.find(w => w.weekNum === n) || {}).sessions || [];
    const dates = getWeekDateRangeDates(n);
    const dateRange = dates ? formatWeekDateRange(dates.start, dates.end) : '';
    const weekPhaseName = WEEK_PHASES.find(p => p.weeks.includes(n))?.name || '';

    const nbDone = sessions.filter(s => completed[s.id]).length;
    const nbSkipped = sessions.filter(s => skipped[s.id]).length;
    const nbTotal = sessions.length;

    let titleLine = '## S' + n + ' — ' + weekPhaseName + ' · ' + dateRange;
    if (n === activeWeekNum) titleLine += ' ← SEMAINE EN COURS';
    md += titleLine + '\n';
    md += '> ' + nbDone + '/' + nbTotal + ' séances réalisées · ' + nbSkipped + ' sautée(s)\n';

    // Tableau des séances
    md += '\n| Séance | Discipline | Statut | Durée | Résultat | RPE | Note |\n';
    md += '|--------|-----------|--------|-------|----------|-----|------|\n';

    for (const s of sessions) {
      // Discipline
      const disc = getDiscipline(s.id);
      const discLabel = disc === 'swim' ? 'Natation'
        : disc === 'bike' ? 'Vélo'
        : disc === 'run' ? 'Course'
        : disc === 'str' ? 'Muscu'
        : disc === 'brick' ? 'Brick'
        : disc || '';

      // Statut
      let statut;
      if (completed[s.id] && adapted[s.id]) {
        statut = '≈ Adapté';
      } else if (completed[s.id]) {
        statut = '✓ Fait';
      } else if (skipped[s.id]) {
        statut = '⊘ Sauté';
      } else {
        statut = '○ À faire';
      }

      // Durée
      const duree = (s.dist || s.dist === 0) ? s.dist + ' min' : '—';

      // Résultat
      const perf = perfResults[s.id];
      let resultat;
      if (!perf) {
        resultat = '—';
      } else if (disc === 'swim') {
        const paceStr = perf.paceS ? formatSecondsToMMSS(perf.paceS) + '/100m' : '';
        const distStr = perf.distM ? perf.distM + 'm' : '';
        resultat = [distStr, paceStr].filter(Boolean).join(' · ') || '—';
      } else if (disc === 'bike') {
        const wStr = perf.watts ? perf.watts + 'W' : '';
        const dStr = perf.distKm ? perf.distKm + 'km' : '';
        resultat = [wStr, dStr].filter(Boolean).join(' · ') || '—';
      } else if (disc === 'run') {
        const paceStr = perf.paceKmS ? formatSecondsToMMSS(perf.paceKmS) + '/km' : '';
        const dStr = perf.distKm ? perf.distKm + 'km' : '';
        resultat = [paceStr, dStr].filter(Boolean).join(' · ') || '—';
      } else if (disc === 'str') {
        resultat = perf.chargesNote ? perf.chargesNote.slice(0, 60) : '—';
      } else {
        resultat = '—';
      }

      // RPE
      const rpeStr = perf && perf.rpe != null ? perf.rpe + '/10' : '—';

      // Note — sessionNotes (pas notes)
      const noteStr = sessionNotes[s.id] || '';

      // Échapper les | dans les cellules pour ne pas casser le tableau
      const escape = (str) => String(str).replace(/\|/g, '\\|').replace(/\n/g, ' ');

      md += '| ' + escape(s.id) + ' | ' + escape(discLabel) + ' | ' + escape(statut) + ' | ' + escape(duree) + ' | ' + escape(resultat) + ' | ' + escape(rpeStr) + ' | ' + escape(noteStr) + ' |\n';
    }

    md += '\n';
  }

  // Téléchargement
  const isoDate = today.toISOString().slice(0, 10);
  const blob = new Blob([md], { type: 'text/markdown; charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hiplan-rapport-coach-' + isoDate + '.md';
  a.click();
  URL.revokeObjectURL(url);
}

function takeSnapshot() {
  let ring = [];
  try {
    const raw = JSON.parse(localStorage.getItem(STORE.snapshots) || '[]');
    ring = Array.isArray(raw) ? raw : [];
  } catch { ring = []; }
  ring.unshift({ ts: Date.now(), data: collectStateSnapshot() });
  if (ring.length > 3) ring = ring.slice(0, 3);
  try {
    localStorage.setItem(STORE.snapshots, JSON.stringify(ring));
  } catch (e) {
    if (e.name === 'QuotaExceededError') console.warn('[HIPLAN] Quota localStorage dépassé — snapshot ignoré');
  }
}

function takeSnapshotIfNeeded() {
  let ring = [];
  try {
    const raw = JSON.parse(localStorage.getItem(STORE.snapshots) || '[]');
    ring = Array.isArray(raw) ? raw : [];
  } catch { ring = []; }
  if (ring.length > 0 && new Date(ring[0].ts).toDateString() === new Date().toDateString()) return;
  takeSnapshot();
}

function triggerImport() {
  document.getElementById('importFileInput').value = '';
  document.getElementById('importFileInput').click();
}

function importData(event) {
  takeSnapshot(); // protection avant écrasement
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.version || data.version !== 1) {
        showToast('import-version');
        return;
      }
      if (!data.completed || typeof data.completed !== 'object' || Array.isArray(data.completed) ||
          !data.skipped   || typeof data.skipped   !== 'object' || Array.isArray(data.skipped))
        throw new Error('Format invalide');
      localStorage.setItem(STORE.completed,   JSON.stringify(data.completed));
      localStorage.setItem(STORE.skipped,     JSON.stringify(data.skipped));
      localStorage.setItem(STORE.notes,       JSON.stringify(data.notes       || {}));
      localStorage.setItem(STORE.results,     JSON.stringify(data.results     || {}));
      localStorage.setItem(STORE.perfResults, JSON.stringify(data.perfResults || {}));
      if (data.programEnd) localStorage.setItem(STORE.programEnd, data.programEnd);
      completed      = loadStoredState(STORE.completed);
      skipped        = loadStoredState(STORE.skipped);
      sessionNotes   = loadStoredState(STORE.notes);
      sessionResults = loadStoredState(STORE.results);
      perfResults    = loadStoredState(STORE.perfResults);
      refreshCalendarViews();
      showToast('import-ok');
    } catch {
      showToast('import-error');
    }
  };
  reader.readAsText(file);
}

function formatSnapshotDate(ts) {
  const d = new Date(ts);
  const date = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  const time = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  return date + ' à ' + time;
}

function getSnapshotSummary(data) {
  try {
    const count = Object.keys(data.completed || {}).length;
    return count + ' séance' + (count > 1 ? 's' : '') + ' faite' + (count > 1 ? 's' : '');
  } catch {
    return 'Données';
  }
}

function openSnapshotsPanel() {
  let ring = [];
  try { ring = JSON.parse(localStorage.getItem(STORE.snapshots) || '[]'); } catch { ring = []; }
  if (!Array.isArray(ring)) ring = [];

  const body = document.getElementById('snapshotsBody');
  if (!ring.length) {
    body.innerHTML = '<div class="snapshots-empty">Aucune sauvegarde disponible.</div>';
  } else {
    body.innerHTML = ring.map((snap, idx) => `
      <div class="snapshot-item">
        <div class="snapshot-info">
          <div class="snapshot-date">${formatSnapshotDate(snap.ts)}</div>
          <div class="snapshot-summary">${getSnapshotSummary(snap.data)}</div>
        </div>
        <button class="snapshot-restore-btn" onclick="openSnapshotModal(${idx})">Restaurer</button>
      </div>
    `).join('');
  }

  const backdrop = document.getElementById('snapshots-backdrop');
  const panel    = document.getElementById('snapshots-panel');
  backdrop.style.display = 'block';
  panel.style.display    = 'flex';
  requestAnimationFrame(() => panel.classList.add('open'));
}

function closeSnapshotsPanel() {
  const panel    = document.getElementById('snapshots-panel');
  const backdrop = document.getElementById('snapshots-backdrop');
  panel.classList.remove('open');
  setTimeout(() => {
    panel.style.display    = 'none';
    backdrop.style.display = 'none';
  }, 300);
}

function openSnapshotModal(idx) {
  let ring = [];
  try { ring = JSON.parse(localStorage.getItem(STORE.snapshots) || '[]'); } catch { ring = []; }
  if (!Array.isArray(ring) || !ring[idx]) return;

  const snap = ring[idx];
  document.getElementById('snapshotModalBody').textContent =
    'Remplacer les données actuelles par la sauvegarde du ' +
    formatSnapshotDate(snap.ts) +
    ' ? Les données actuelles seront d\'abord sauvegardées automatiquement.';

  const btn = document.getElementById('snapshotConfirmBtn');
  btn.onclick = () => restoreSnapshot(idx);

  document.getElementById('snapshot-confirm-backdrop').style.display = 'block';
  document.getElementById('snapshot-confirm-modal').style.display    = 'flex';
}

function closeSnapshotModal() {
  document.getElementById('snapshot-confirm-backdrop').style.display = 'none';
  document.getElementById('snapshot-confirm-modal').style.display    = 'none';
}

function restoreSnapshot(idx) {
  let ring = [];
  try { ring = JSON.parse(localStorage.getItem(STORE.snapshots) || '[]'); } catch { ring = []; }
  if (!Array.isArray(ring) || !ring[idx]) { closeSnapshotModal(); return; }

  // Snapshot de sécurité de l'état courant avant écrasement
  takeSnapshot();

  const data = ring[idx].data;
  try {
    localStorage.setItem(STORE.completed,   JSON.stringify(data.completed   || {}));
    localStorage.setItem(STORE.skipped,     JSON.stringify(data.skipped     || {}));
    localStorage.setItem(STORE.notes,       JSON.stringify(data.notes       || {}));
    localStorage.setItem(STORE.results,     JSON.stringify(data.results     || {}));
    localStorage.setItem(STORE.perfResults, JSON.stringify(data.perfResults || {}));
    if (data.programEnd) localStorage.setItem(STORE.programEnd, data.programEnd);
  } catch (e) {
    console.error('[HIPLAN] Erreur lors de la restauration du snapshot :', e);
    closeSnapshotModal();
    return;
  }

  closeSnapshotModal();
  closeSnapshotsPanel();
  showToast('snapshot-restored');
  setTimeout(() => location.reload(), 1200);
}

function showToast(state) {
  const t = document.getElementById('toast');
  if (state === true)        { t.textContent = '✓ Séance validée !';  t.style.background = 'var(--green)'; }
  else if (state === false)  { t.textContent = '↩ Séance dévalidée'; t.style.background = 'var(--muted)'; }
  else if (state === 'skip') { t.textContent = '⏭ Séance skippée';   t.style.background = 'var(--orange)'; }
  else if (state === 'date-saved') { t.textContent = '✓ Date de fin enregistrée'; t.style.background = 'var(--green)'; }
  else if (state === 'date-error') { t.textContent = 'Choisis une date valide'; t.style.background = 'var(--orange)'; }
  else if (state === 'note-saved') { t.textContent = '✓ Note enregistrée'; t.style.background = 'var(--green)'; }
  else if (state === 'notes-copied') { t.textContent = '📋 Notes copiées'; t.style.background = 'var(--green)'; }
  else if (state === 'notes-empty') { t.textContent = 'Aucune note à copier'; t.style.background = 'var(--muted)'; }
  else if (state === 'notes-error')  { t.textContent = 'Copie impossible';           t.style.background = 'var(--orange)'; }
  else if (state === 'import-ok')     { t.textContent = '✓ Données restaurées';        t.style.background = 'var(--green)'; }
  else if (state === 'import-error')  { t.textContent = '✗ Fichier invalide';          t.style.background = 'var(--red)'; }
  else if (state === 'import-version') { t.textContent = '⚠️ Format inconnu';           t.style.background = 'var(--orange)'; }
  else if (state === 'result-saved')  { t.textContent = '⏱ Résultat enregistré';      t.style.background = 'var(--green)'; }
  else if (state === 'perf-saved')   { t.textContent = '✓ Résultats enregistrés';    t.style.background = 'var(--green)'; }
  else if (state === 'perf-skipped') { t.textContent = 'Séance validée ✏ résultats à saisir'; t.style.background = 'var(--muted)'; }
  else if (state === 'snapshot-restored') { t.textContent = 'Données restaurées depuis la sauvegarde'; t.style.background = 'var(--green)'; }
  else if (state === 'snapshot-none')     { t.textContent = 'Aucune sauvegarde disponible'; t.style.background = 'var(--muted)'; }
  else if (state === 'storage-quota') { t.textContent = 'Stockage plein — données non sauvegardées'; t.style.background = 'var(--red)'; }
  else if (state === 'sw-update')  { t.textContent = 'Nouvelle version dispo — recharge la page'; t.style.background = 'var(--accent)'; }
  else if (state === 'sw-offline') { t.textContent = 'Disponible hors-ligne'; t.style.background = 'var(--green)'; }
  else if (state === 'adapted') { t.textContent = 'Séance marquée Adapté'; t.style.background = 'var(--orange)'; }
  else if (state === 'fit-exported') { t.textContent = '⌚ Fichier .FIT téléchargé'; t.style.background = 'var(--green)'; }
  else                       { t.textContent = '↩ Skip annulé';       t.style.background = 'var(--muted)'; }
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function updateStats() {
  let done = 0, total = 0;
  const weeksActive = new Set();
  let skippedCount = 0;
  let minSwim = 0, minBike = 0, minRun = 0;

  weeklyPlan.forEach(w => {
    if (w.weekNum > TOTAL_WEEKS) return;
    w.sessions.forEach(s => {
      total++;
      if (completed[s.id] || adapted[s.id]) {
        done++;
        weeksActive.add(w.weekNum);
        const disc = getDiscipline(s.id);
        if (disc === 'swim')       minSwim += (s.dist || 0);
        else if (disc === 'brick') { minBike += (s.dist || 0); minRun += (s.dist || 0); }
        else if (disc === 'bike')  minBike += (s.dist || 0);
        else if (disc === 'run')   minRun  += (s.dist || 0);
      }
      if (skipped[s.id]) skippedCount++;
    });
  });

  const skippedEl = document.getElementById('statSkipped');
  if (skippedEl) skippedEl.textContent = skippedCount;

  const setEl = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  setEl('statDone',    done);
  setEl('statTotal',   total);
  setEl('statWeek',    weeksActive.size);
  setEl('statKmSwim',  minSwim);
  setEl('statMinBike', minBike);
  setEl('statKmRun',   minRun);

  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const bar   = document.getElementById('globalBar');
  const pctEl = document.getElementById('globalPct');
  if (bar)   bar.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';
}

  perfSheetOpenCards = openCards;
  perfSheetSelectedRpe = null;
  perfSheetDiscipline = null;

  // Find session and discipline in current week
  const weekSessions = getWeekSessions(currentWeekView);
  let session = null;
  let discipline = null;
  for (const [disc, sessions] of Object.entries(weekSessions)) {
    const found = sessions.find(s => s.id === id);
    if (found) { session = found; discipline = disc; break; }
  }
  if (!session || !discipline) {
    // Fallback: rebuild without opening sheet
    buildWeekView(currentWeekView);
    restoreOpenWeekSessions(openCards);
    updateStats();
    showToast(true);
    return;
  }

  perfSheetDiscipline = discipline;
  const config = DISCIPLINE_CONFIG[discipline] || DISCIPLINE_CONFIG.swim;
  const accent = config.accent;
  const existing = perfResults[id] || null;
  perfSheetHadData = !!existing;

  // Fill header
  const labelEl = document.querySelector('.perf-discipline-label');
  const nameEl  = document.querySelector('.perf-session-name');
  if (labelEl) { labelEl.textContent = config.emoji + ' ' + config.label; labelEl.style.color = accent; }
  if (nameEl)  nameEl.textContent = getSessionDisplayName(session);

  // Submit button
  const submitBtn = document.getElementById('perfSubmitBtn');
  if (submitBtn) { submitBtn.style.background = accent; submitBtn.disabled = true; }

  // RPE grid
  buildRpeGrid(existing ? existing.rpe : null);

  // Pre-fill RPE if existing
  if (existing && existing.rpe) {
    perfSheetSelectedRpe = existing.rpe;
    if (submitBtn) submitBtn.disabled = false;
  }

  // Metrics
  buildMetricsSection(discipline, session, existing);

  // Show sheet
  const backdrop = document.getElementById('perf-backdrop');
  const sheet    = document.getElementById('perf-sheet');
  if (backdrop) backdrop.style.display = 'block';
  if (sheet) {
    sheet.style.display = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
  }
}

function buildRpeGrid(existingRpe) {
  const grid      = document.getElementById('rpeGrid');
  const labelZone = document.getElementById('rpeLabelZone');
  if (!grid) return;
  grid.innerHTML = '';
  if (labelZone) labelZone.textContent = '';

  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'rpe-btn';
    btn.textContent = i;
    const val = i;
    btn.onclick = () => selectRpe(val);
    if (i === existingRpe) {
      const c = RPE_COLORS[i];
      btn.classList.add('selected');
      btn.style.background   = c.bg;
      btn.style.borderColor  = c.bg;
      btn.style.color        = c.txt;
      if (labelZone) { labelZone.textContent = RPE_LABELS[i] || ''; labelZone.style.color = c.bg; }
    }
    grid.appendChild(btn);
  }
}

function selectRpe(val) {
  perfSheetSelectedRpe = val;
  document.querySelectorAll('.rpe-btn').forEach((b, idx) => {
    b.classList.remove('selected');
    b.style.background  = '';
    b.style.borderColor = '';
    b.style.color       = '';
    if (idx + 1 === val) {
      const c = RPE_COLORS[val];
      b.classList.add('selected');
      b.style.background  = c.bg;
      b.style.borderColor = c.bg;
      b.style.color       = c.txt;
    }
  });
  const labelZone = document.getElementById('rpeLabelZone');
  if (labelZone) {
    labelZone.textContent = RPE_LABELS[val] || '';
    labelZone.style.color = RPE_COLORS[val]?.bg || '#e2eaf4';
  }
  const btn = document.getElementById('perfSubmitBtn');
  if (btn) btn.disabled = false;
}

function updateBikeDiff(val) {
  const diffEl  = document.getElementById('perf-watts-diff');
  const inputEl = document.getElementById('perf-watts');
  if (!diffEl) return;
  const target = inputEl?.dataset?.target ? parseInt(inputEl.dataset.target) : null;
  if (!target) { diffEl.style.display = 'none'; return; }
  if (!val) { diffEl.style.display = 'none'; return; }
  diffEl.style.display = 'flex';
  const diff = parseInt(val) - target;
  // Zone = cible ±5% : vert dans la zone, orange au-dessus, bleu en-dessous (jamais rouge)
  const tol   = Math.round(target * 0.05);
  const color = Math.abs(diff) <= tol ? '#4ade80' : (diff > 0 ? '#fb923c' : '#38bdf8');
  const sign  = diff >= 0 ? '+' : '';
  diffEl.innerHTML = `<span class="perf-diff-dot" style="background:${color}"></span><span style="color:${color}">${sign}${diff} W vs cible ${target} W</span>`;
}

function buildMetricsSection(discipline, session, existing) {
  const container = document.getElementById('perfMetrics');
  if (!container) return;
  container.innerHTML = '';

  if (discipline === 'swim') {
    const targetDist = session.dist || '';
    const distVal    = existing?.distM ?? '';
    const paceMin    = (existing?.paceS !== undefined) ? Math.floor(existing.paceS / 60) : '';
    const paceSec    = (existing?.paceS !== undefined) ? String(existing.paceS % 60).padStart(2, '0') : '';

    container.innerHTML = `
      <div class="perf-metric-block">
        <div class="perf-label-row">
          <span class="perf-label-row-left">Distance réalisée</span>
          ${targetDist ? `<span class="perf-label-row-right">${targetDist} m planifiés</span>` : ''}
        </div>
        <div class="perf-input-wrap">
          <input type="number" class="perf-input" id="perf-distM"
            placeholder="${targetDist || '0'}" value="${distVal}" min="0" max="10000">
          <span class="perf-input-suffix">m</span>
        </div>
      </div>
      <div class="perf-metric-block">
        <div class="perf-label-row">
          <span class="perf-label-row-left">Pace crawl</span>
          <span class="perf-optional-tag">OPTIONNEL</span>
        </div>
        <div class="perf-pace-group">
          <input type="number" class="perf-pace-input" id="perf-pace-mm"
            placeholder="1" min="0" max="9" value="${paceMin}"
            oninput="if(this.value.length>=1)document.getElementById('perf-pace-ss').focus()">
          <span class="perf-pace-sep">:</span>
          <input type="number" class="perf-pace-input" id="perf-pace-ss"
            placeholder="30" min="0" max="59" value="${paceSec}">
          <span class="perf-pace-suffix">/100m</span>
        </div>
      </div>
    `;

  } else if (discipline === 'bike') {
    const wattsVal = existing?.watts    ?? '';
    const durVal   = existing?.durationMin ?? '';
    const distVal  = existing?.distKm   ?? '';
    const planDur  = session.dist || '';

    container.innerHTML = `
      <div class="perf-metric-block">
        <div class="perf-label-row">
          <span class="perf-label-row-left">Puissance moyenne</span>
        </div>
        <div class="perf-input-wrap">
          <input type="number" class="perf-input" id="perf-watts"
            placeholder="150" value="${wattsVal}" min="0" max="600"
            oninput="updateBikeDiff(this.value)">
          <span class="perf-input-suffix">W</span>
        </div>
        <div class="perf-diff" id="perf-watts-diff" style="display:none"></div>
      </div>
      <div class="perf-2col">
        <div class="perf-metric-block">
          <div class="perf-label-row">
            <span class="perf-label-row-left">Durée</span>
          </div>
          <div class="perf-input-wrap">
            <input type="number" class="perf-input" id="perf-durationMin"
              placeholder="${planDur || '60'}" value="${durVal}" min="0" max="600">
            <span class="perf-input-suffix">min</span>
          </div>
        </div>
        <div class="perf-metric-block">
          <div class="perf-label-row">
            <span class="perf-label-row-left">Distance</span>
          </div>
          <div class="perf-input-wrap">
            <input type="number" class="perf-input" id="perf-distKm"
              placeholder="0" value="${distVal}" min="0" max="300" step="0.1">
            <span class="perf-input-suffix">km</span>
          </div>
        </div>
      </div>
    `;

    // Target watts from session tip or first set tip
    const tipText   = (session.tip || '') + ' ' + (session.sets?.[0]?.tip || '');
    const wMatch    = tipText.match(/(\d{2,3})\s*W/);
    const targetW   = wMatch ? parseInt(wMatch[1]) : null;
    if (targetW) {
      const wInput = document.getElementById('perf-watts');
      if (wInput) {
        wInput.dataset.target = targetW;
        if (wattsVal) updateBikeDiff(wattsVal);
      }
    }

  } else if (discipline === 'run') {
    const paceMin = (existing?.paceKmS !== undefined) ? Math.floor(existing.paceKmS / 60) : '';
    const paceSec = (existing?.paceKmS !== undefined) ? String(existing.paceKmS % 60).padStart(2, '0') : '';
    const distVal = existing?.distKm ?? '';

    container.innerHTML = `
      <div class="perf-metric-block">
        <div class="perf-label-row">
          <span class="perf-label-row-left">Allure</span>
        </div>
        <div class="perf-pace-group">
          <input type="number" class="perf-pace-input" id="perf-pace-mm"
            placeholder="5" min="0" max="15" value="${paceMin}"
            oninput="if(this.value.length>=2||(this.value.length>=1&&parseInt(this.value)<=9))document.getElementById('perf-pace-ss').focus()">
          <span class="perf-pace-sep">:</span>
          <input type="number" class="perf-pace-input" id="perf-pace-ss"
            placeholder="00" min="0" max="59" value="${paceSec}">
          <span class="perf-pace-suffix">/km</span>
        </div>
      </div>
      <div class="perf-metric-block">
        <div class="perf-label-row">
          <span class="perf-label-row-left">Distance</span>
        </div>
        <div class="perf-input-wrap">
          <input type="number" class="perf-input" id="perf-distKm"
            placeholder="0" value="${distVal}" min="0" max="100" step="0.1">
          <span class="perf-input-suffix">km</span>
        </div>
      </div>
    `;

  } else if (discipline === 'str') {
    const noteVal = existing?.chargesNote ?? '';
    container.innerHTML = `
      <div class="perf-metric-block">
        <div class="perf-label-row">
          <span class="perf-label-row-left">Note charges</span>
          <span class="perf-optional-tag">OPTIONNEL</span>
        </div>
        <textarea class="perf-textarea" id="perf-charges"
          placeholder="Ex : Squat 80kg x 5, dev. couche 60kg x 8..."
          onclick="event.stopPropagation()"
          onkeydown="event.stopPropagation()">${escapeHtml(noteVal)}</textarea>
      </div>
    `;
  }
}

function submitPerfSheet() {
  if (!perfSheetSelectedRpe) return;
  const id   = perfSheetSessionId;
  const disc = perfSheetDiscipline;
  const data = { rpe: perfSheetSelectedRpe };

  if (disc === 'swim') {
    const distMEl  = document.getElementById('perf-distM');
    const mmEl     = document.getElementById('perf-pace-mm');
    const ssEl     = document.getElementById('perf-pace-ss');
    if (distMEl?.value)  { const v = parseInt(distMEl.value);  if (!isNaN(v) && v > 0) data.distM = v; }
    if (mmEl && ssEl && (mmEl.value !== '' || ssEl.value !== '')) {
      const mm = parseInt(mmEl.value) || 0;
      const ss = parseInt(ssEl.value) || 0;
      if (mm > 0 || ss > 0) data.paceS = mm * 60 + ss;
    }
  } else if (disc === 'bike') {
    const wattsEl = document.getElementById('perf-watts');
    const durEl   = document.getElementById('perf-durationMin');
    const distEl  = document.getElementById('perf-distKm');
    if (wattsEl?.value)  { const v = parseInt(wattsEl.value);   if (!isNaN(v) && v > 0) data.watts       = v; }
    if (durEl?.value)    { const v = parseInt(durEl.value);     if (!isNaN(v) && v > 0) data.durationMin  = v; }
    if (distEl?.value)   { const v = parseFloat(distEl.value);  if (!isNaN(v) && v > 0) data.distKm       = v; }
  } else if (disc === 'run') {
    const mmEl   = document.getElementById('perf-pace-mm');
    const ssEl   = document.getElementById('perf-pace-ss');
    const distEl = document.getElementById('perf-distKm');
    if (mmEl && ssEl && (mmEl.value !== '' || ssEl.value !== '')) {
      const mm = parseInt(mmEl.value) || 0;
      const ss = parseInt(ssEl.value) || 0;
      if (mm > 0 || ss > 0) data.paceKmS = mm * 60 + ss;
    }
    if (distEl?.value) { const v = parseFloat(distEl.value); if (!isNaN(v) && v > 0) data.distKm = v; }
  } else if (disc === 'str') {
    const chargesEl = document.getElementById('perf-charges');
    if (chargesEl?.value.trim()) data.chargesNote = chargesEl.value.trim();
  }

  perfResults[id] = data;
  localStorage.setItem(STORE.perfResults, JSON.stringify(perfResults));
  closePerfSheet(true);
}

function closePerfSheet(didSave) {
  const sheet    = document.getElementById('perf-sheet');
  const backdrop = document.getElementById('perf-backdrop');
  const wasNew   = !perfSheetHadData;

  sheet?.classList.remove('open');
  setTimeout(() => {
    if (sheet)    sheet.style.display    = 'none';
    if (backdrop) backdrop.style.display = 'none';
  }, 320);

  buildWeekView(currentWeekView);
  restoreOpenWeekSessions(perfSheetOpenCards || []);
  updateStats();

  if (didSave) {
    showToast('perf-saved');
  } else if (wasNew) {
    showToast('perf-skipped');
  }

  // Reset state
  perfSheetSessionId   = null;
  perfSheetOpenCards   = null;
  perfSheetSelectedRpe = null;
  perfSheetDiscipline  = null;
  perfSheetHadData     = false;
}

function buildPerfResultsRowHtml(session, disciplineKey) {
  const perf = perfResults[session.id];

  if (!perf) {
    return `<div class="wsc-results-row">
      <span class="wsc-add-perf-link" onclick="event.stopPropagation(); openPerfSheet('${session.id}', getOpenWeekSessionIds())">+ Ajouter les résultats</span>
    </div>`;
  }

  const rpeColor = RPE_COLORS[perf.rpe] || { bg: '#5a7a99', txt: '#fff' };
  const badge = `<span class="wsc-rpe-badge" style="background:${rpeColor.bg};color:${rpeColor.txt}">RPE ${perf.rpe}</span>`;

  const parts = [];
  if (disciplineKey === 'swim') {
    if (perf.distM)                   parts.push(`<span class="sum-val">${perf.distM}</span><span class="sum-label">m</span>`);
  } else if (disciplineKey === 'bike') {
    if (perf.watts)  parts.push(`<span class="sum-val">${perf.watts}</span><span class="sum-label"> W</span>`);
    if (perf.distKm) parts.push(`<span class="sum-val">${perf.distKm}</span><span class="sum-label"> km</span>`);
  } else if (disciplineKey === 'run') {
    if (perf.paceKmS) {
      const mm = Math.floor(perf.paceKmS / 60);
      const ss = String(perf.paceKmS % 60).padStart(2, '0');
      parts.push(`<span class="sum-val">${mm}:${ss}</span><span class="sum-label">/km</span>`);
    }
    if (perf.distKm) parts.push(`<span class="sum-val">${perf.distKm}</span><span class="sum-label"> km</span>`);
  }
  // str : pas de ligne résumé

  const summaryHtml = parts.length
    ? `<span class="wsc-summary-line">${parts.join('<span class="sum-sep"> · </span>')}</span>`
    : '<span class="wsc-summary-line"></span>';

  const editBtn = `<button class="wsc-edit-btn" onclick="event.stopPropagation(); openPerfSheet('${session.id}', getOpenWeekSessionIds())" aria-label="Modifier les résultats">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11.5 2.5L13.5 4.5L5 13H3V11L11.5 2.5Z"/>
      <path d="M10 4L12 6"/>
    </svg>
  </button>`;

  return `<div class="wsc-results-row">${badge}${summaryHtml}${editBtn}</div>`;
}

// WEEKLY RECAP — Bilan de fin de semaine
// ═══════════════════════════════════════════════════

function getWeekSummary(weekNum) {
  const week = weeklyPlan.find(w => w.weekNum === weekNum);
  if (!week) return { done: 0, total: 0, minutesByDiscipline: { swim: 0, bike: 0, run: 0, str: 0, brick: 0 }, avgRpe: null, hardestSession: null, weeklyLoad: 0 };

  const sessions = week.sessions;
  const total = sessions.length;
  let done = 0;
  const minutesByDiscipline = { swim: 0, bike: 0, run: 0, str: 0, brick: 0 };
  let rpeSum = 0, rpeCount = 0;
  let hardestSession = null, hardestRpe = 0;
  let weeklyLoad = 0;

  sessions.forEach(s => {
    if (completed[s.id]) {
      done++;
      const disc = getDiscipline(s.id);
      if (disc && disc in minutesByDiscipline) {
        minutesByDiscipline[disc] += (s.dist || 0);
      }
      const perf = perfResults[s.id];
      if (perf && perf.rpe) {
        rpeSum += perf.rpe;
        rpeCount++;
        if (perf.rpe > hardestRpe) {
          hardestRpe = perf.rpe;
          hardestSession = { name: s.name, rpe: perf.rpe };
        }
        weeklyLoad += perf.rpe * (s.dist || 0);
      }
    }
  });

  return {
    done,
    total,
    minutesByDiscipline,
    avgRpe: rpeCount > 0 ? Math.round((rpeSum / rpeCount) * 10) / 10 : null,
    hardestSession,
    weeklyLoad
  };
}

// SESSION HISTORY SHEET — Historique par type de séance
// ═══════════════════════════════════════════════════

function getHistKeyMetric(disc, perf) {
  if (!perf) return null;
  if (disc === 'swim') {
    if (perf.paceS  > 0) return secondsToMmss(perf.paceS)   + ' /100m';
    if (perf.distM  > 0) return perf.distM + ' m';
    return null;
  }
  if (disc === 'bike') {
    if (perf.watts  > 0) return perf.watts + ' W';
    return null;
  }
  if (disc === 'run') {
    if (perf.paceKmS > 0) return secondsToMmss(perf.paceKmS) + ' /km';
    if (perf.distKm  > 0) return perf.distKm + ' km';
    return null;
  }
  if (disc === 'str') {
    if (perf.chargesNote) {
      const note = perf.chargesNote.trim();
      return note.length > 42 ? note.slice(0, 39) + '…' : note;
    }
    return null;
  }
  return null; // brick : RPE seul, pas de métrique clé
}

function buildSessionHistoryContent(sessionId) {
  // 1. Trouver le type de la séance cible
  var targetType = null;
  for (var wi = 0; wi < weeklyPlan.length; wi++) {
    var ws = weeklyPlan[wi].sessions.find(function(sess) { return sess.id === sessionId; });
    if (ws) { targetType = ws.type || null; break; }
  }

  var typeLabel = (targetType && SESSION_TYPE_LABELS[targetType])
    ? SESSION_TYPE_LABELS[targetType]
    : (targetType || 'Type inconnu');

  // 2. Collecter toutes les séances du même type, complétées ou skippées
  var matches = [];
  for (var wi2 = 0; wi2 < weeklyPlan.length; wi2++) {
    var week = weeklyPlan[wi2];
    for (var si = 0; si < week.sessions.length; si++) {
      var s = week.sessions[si];
      if (targetType && s.type !== targetType) continue;
      if (!targetType && s.id !== sessionId) continue; // fallback : séance seule
      var isDone    = !!completed[s.id];
      var isSkipped = !!skipped[s.id];
      if (!isDone && !isSkipped) continue;
      matches.push({ session: s, weekNum: week.weekNum, isDone: isDone, isSkipped: isSkipped });
    }
  }

  // 3. Trier : semaine la plus récente en premier
  matches.sort(function(a, b) { return b.weekNum - a.weekNum; });

  if (matches.length === 0) {
    return {
      count: 0,
      typeLabel: typeLabel,
      html: '<p class="hist-empty">Aucune séance de ce type complétée pour l\'instant.</p>'
    };
  }

  // 4. Construire les lignes HTML
  var rows = matches.map(function(item) {
    var s = item.session;
    var disc = getDiscipline(s.id);
    var perf = item.isDone ? (perfResults[s.id] || null) : null;
    var rpeColor = (perf && perf.rpe)
      ? (RPE_COLORS[perf.rpe] || { bg: '#5a7a99', txt: '#fff' })
      : null;
    var rpeBadge = rpeColor
      ? '<span class="hist-item-rpe" style="background:' + rpeColor.bg + ';color:' + rpeColor.txt + '">RPE ' + perf.rpe + '</span>'
      : '';
    var metric = getHistKeyMetric(disc, perf);
    var metricHtml = metric
      ? '<span class="hist-item-metric">' + escapeHtml(metric) + '</span>'
      : '';
    var skippedClass = item.isSkipped ? ' hist-item-skipped' : '';
    var skippedTag   = item.isSkipped ? '<span class="hist-skipped-tag">Passée</span>' : '';
    var hasBottom    = rpeBadge || metricHtml;

    return '<div class="hist-item' + skippedClass + '">'
      + '<div class="hist-item-top">'
      +   '<span class="hist-item-week">S' + item.weekNum + '</span>'
      +   '<span class="hist-item-name">' + escapeHtml(s.name) + '</span>'
      +   skippedTag
      + '</div>'
      + (hasBottom
        ? '<div class="hist-item-bottom">' + rpeBadge + metricHtml + '</div>'
        : '')
      + '</div>';
  }).join('');

  return { count: matches.length, typeLabel: typeLabel, html: rows };
}

function openSessionHistorySheet(sessionId) {
  var backdrop = document.getElementById('session-history-backdrop');
  var sheet    = document.getElementById('session-history-sheet');
  var body     = document.getElementById('session-history-body');
  var titleEl  = document.getElementById('session-history-title');
  var countEl  = document.getElementById('session-history-count');
  if (!backdrop || !sheet || !body) return;

  var result = buildSessionHistoryContent(sessionId);

  if (titleEl) titleEl.textContent = result.typeLabel;
  if (countEl) {
    countEl.textContent = result.count > 0
      ? result.count + ' séance' + (result.count > 1 ? 's' : '')
      : '';
  }
  body.innerHTML = result.html;

  backdrop.style.display = 'block';
  sheet.style.display    = 'block';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() { sheet.classList.add('open'); });
  });
}

function closeSessionHistorySheet() {
  var sheet    = document.getElementById('session-history-sheet');
  var backdrop = document.getElementById('session-history-backdrop');
  if (!sheet) return;
  sheet.style.transition = '';
  sheet.style.transform  = '';
  requestAnimationFrame(function() {
    sheet.classList.remove('open');
    setTimeout(function() {
      sheet.style.display = 'none';
      if (backdrop) backdrop.style.display = 'none';
    }, 350);
  });
}

function initHistorySheetSwipe() {
  var handle = document.querySelector('#session-history-sheet .hist-sheet-handle');
  var sheet  = document.getElementById('session-history-sheet');
  if (!handle || !sheet) return;

  var startY = 0, currentDelta = 0;

  handle.addEventListener('touchstart', function(e) {
    startY = e.touches[0].clientY;
    currentDelta = 0;
    sheet.style.transition = 'none';
  }, { passive: true });

  handle.addEventListener('touchmove', function(e) {
    var delta = e.touches[0].clientY - startY;
    if (delta > 0) {
      currentDelta = delta;
      sheet.style.transform = 'translateY(' + delta + 'px)';
    }
  }, { passive: true });

  handle.addEventListener('touchend', function() {
    sheet.style.transition = '';
    if (currentDelta > 80) {
      closeSessionHistorySheet();
    } else {
      sheet.style.transform = '';
    }
    currentDelta = 0;
  });
}

function closeWeeklyRecap() {
  const sheet    = document.getElementById('weekly-recap-sheet');
  const backdrop = document.getElementById('weekly-recap-backdrop');
  if (!sheet) return;
  sheet.style.transition = '';
  sheet.style.transform  = '';
  requestAnimationFrame(() => {
    sheet.classList.remove('open');
    setTimeout(() => {
      sheet.style.display = 'none';
      if (backdrop) backdrop.style.display = 'none';
    }, 350);
  });
}

function buildWeeklyRecap() {
  const calendarWeek = getCalendarActiveWeekNum();

  function isWeekFullyResolved(wn) {
    const w = weeklyPlan.find(x => x.weekNum === wn);
    if (!w || w.sessions.length === 0) return false;
    return w.sessions.every(s => completed[s.id] || skipped[s.id]);
  }

  let targetWeek = null;

  // Priorité 1 : semaine précédente (passée calendairement)
  if (calendarWeek > 1) {
    const prevWeek = calendarWeek - 1;
    if (!localStorage.getItem(STORE.weeklyRecapShown + prevWeek)) {
      targetWeek = prevWeek;
    }
  }

  // Priorité 2 : semaine active si toutes ses séances sont faites ou skippées
  if (targetWeek === null && isWeekFullyResolved(calendarWeek)) {
    if (!localStorage.getItem(STORE.weeklyRecapShown + calendarWeek)) {
      targetWeek = calendarWeek;
    }
  }

  if (targetWeek === null) return;

  // Marquer comme vu immédiatement
  localStorage.setItem(STORE.weeklyRecapShown + targetWeek, '1');

  const summary = getWeekSummary(targetWeek);

  const titleEl = document.getElementById('recapWeekTitle');
  if (titleEl) titleEl.textContent = 'BILAN — SEMAINE ' + targetWeek;

  const emptyEl = document.getElementById('recapEmpty');
  const gridEl  = document.getElementById('recapGrid');

  if (summary.done === 0) {
    if (emptyEl) emptyEl.style.display = '';
    if (gridEl)  gridEl.style.display  = 'none';
  } else {
    if (emptyEl) emptyEl.style.display = 'none';
    if (gridEl)  gridEl.style.display  = 'grid';

    const cellDone = document.getElementById('recapCellDone');
    if (cellDone) cellDone.innerHTML =
      '<div class="recap-cell-value">' + summary.done + '/' + summary.total + '</div>' +
      '<div class="recap-cell-label">Séances faites</div>';

    const cellMins = document.getElementById('recapCellMins');
    if (cellMins) {
      const rows = Object.entries(summary.minutesByDiscipline)
        .filter(([, mins]) => mins > 0)
        .map(([disc, mins]) => {
          const cfg = DISCIPLINE_CONFIG[disc];
          return '<div class="recap-min-row">' +
            '<span style="color:' + cfg.accent + '">' + cfg.emoji + ' ' + cfg.label + '</span>' +
            '<span class="recap-min-val">' + mins + ' min</span>' +
            '</div>';
        }).join('');
      cellMins.innerHTML = rows ||
        '<div class="recap-cell-label" style="padding-top:4px">—</div>';
    }

    const cellRpe = document.getElementById('recapCellRpe');
    if (cellRpe) {
      if (summary.avgRpe !== null) {
        const rpeColor = (RPE_COLORS[Math.round(summary.avgRpe)] || RPE_COLORS[5]).bg;
        cellRpe.innerHTML =
          '<div class="recap-cell-value" style="color:' + rpeColor + '">' + summary.avgRpe + '</div>' +
          '<div class="recap-cell-label">RPE moyen</div>';
      } else {
        cellRpe.innerHTML =
          '<div class="recap-cell-value">—</div>' +
          '<div class="recap-cell-label">RPE moyen</div>';
      }
    }

    const cellHard = document.getElementById('recapCellHard');
    if (cellHard) {
      if (summary.hardestSession) {
        const rpeColor = (RPE_COLORS[summary.hardestSession.rpe] || RPE_COLORS[5]).bg;
        cellHard.innerHTML =
          '<div class="recap-cell-value" style="color:' + rpeColor + '">RPE ' + summary.hardestSession.rpe + '</div>' +
          '<div class="recap-cell-label">' + summary.hardestSession.name + '</div>';
      } else {
        cellHard.innerHTML =
          '<div class="recap-cell-value">—</div>' +
          '<div class="recap-cell-label">Séance la plus dure</div>';
      }
    }
  }

  const backdrop = document.getElementById('weekly-recap-backdrop');
  const sheet    = document.getElementById('weekly-recap-sheet');
  if (backdrop) backdrop.style.display = 'block';
  if (sheet) {
    sheet.style.display = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
  }
}

function initWeeklyRecapSwipe() {
  const handle = document.querySelector('#weekly-recap-sheet .recap-handle');
  const sheet  = document.getElementById('weekly-recap-sheet');
  if (!handle || !sheet) return;

  let startY = 0, currentDelta = 0;

  handle.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    currentDelta = 0;
    sheet.style.transition = 'none';
  }, { passive: true });

  handle.addEventListener('touchmove', e => {
    const delta = e.touches[0].clientY - startY;
    if (delta > 0) {
      currentDelta = delta;
      sheet.style.transform = 'translateY(' + delta + 'px)';
    }
  }, { passive: true });

  handle.addEventListener('touchend', () => {
    sheet.style.transition = '';
    if (currentDelta > 80) {
      closeWeeklyRecap();
    } else {
      sheet.style.transform = '';
    }
    currentDelta = 0;
  });
}

    // Données corrompues ET snapshot disponible : proposer la restauration
    // Ne PAS appeler takeSnapshotIfNeeded() ici — cela écraserait le snapshot sain
    var _bodyEl = document.getElementById('snapshotModalBody');
    var _btnEl  = document.getElementById('snapshotConfirmBtn');
    if (_bodyEl && _btnEl) {
      _bodyEl.textContent = 'Données incomplètes détectées — restaurer la sauvegarde du ' + formatSnapshotDate(_bootRing[0].ts) + ' ?';

      document.getElementById('snapshot-confirm-backdrop').style.display = 'block';
      document.getElementById('snapshot-confirm-modal').style.display    = 'flex';

if ('serviceWorker' in navigator) {
  // Désinstaller les anciens SW cassés avant d'enregistrer le nouveau
  navigator.serviceWorker.getRegistrations().then(regs => {
    const stale = regs.filter(r => !r.active || r.active.scriptURL.includes('sw.js') === false);
    stale.forEach(r => r.unregister());
  });
  navigator.serviceWorker.register('./sw.js')
    .then(function(reg) {
      reg.addEventListener('updatefound', function() {
        var installing = reg.installing;
        if (!installing) return;
        installing.addEventListener('statechange', function() {
          if (installing.state === 'installed') {
            if (navigator.serviceWorker.controller) {
              // Mise à jour disponible (remplacement d'une version active)
              showToast('sw-update');
            } else {
              // Premier install réussi — app désormais disponible hors-ligne
              showToast('sw-offline');
            }
          }
        });
      });
    })
    .catch(function(err) { console.warn('SW non disponible :', err.message); });
}
