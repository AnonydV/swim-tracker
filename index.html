<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HIPLAN">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semi-marathon — Tracker Course</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090f;
  --bg2: #0d1117;
  --surface: #111827;
  --card: #131d2e;
  --card-hover: #172236;
  --border: #1c2d44;
  --accent: #38bdf8;
  --accent-dim: rgba(56,189,248,0.12);
  --green: #4ade80;
  --green-dim: rgba(74,222,128,0.12);
  --orange: #fb923c;
  --orange-dim: rgba(251,146,60,0.12);
  --brick: #fb923c;
  --red: #f87171;
  --text: #e2eaf4;
  --muted: #5a7a99;
  --muted2: #3a5570;
  --p1: #38bdf8;
  --p2: #4ade80;
  --p3: #fb923c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ─── HEADER ─── */
.app-header {
  background: linear-gradient(180deg, #0a1525 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
  padding: 32px 24px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.logo-block h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 2px;
  line-height: 1;
}
.logo-block h1 span { color: var(--accent); }
.logo-block h1 .app-version {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0;
  color: var(--muted);
  vertical-align: super;
}
.logo-block p {
  font-size: 12px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
}
.progress-global {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  min-width: 180px;
}
.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}
.progress-track {
  width: 180px;
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
}
.progress-pct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--accent);
  letter-spacing: 1px;
}

/* ─── LAYOUT ─── */
.container { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }

/* ─── PHASE TITLE ─── */
.phase-sep {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 40px 0 18px;
}
.phase-pill {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 5px 12px;
  border-radius: 4px;
  border: 1px solid;
  white-space: nowrap;
}
.phase-pill.p1 { color: var(--p1); border-color: var(--p1); background: rgba(56,189,248,0.08); }
.phase-pill.p2 { color: var(--p2); border-color: var(--p2); background: rgba(74,222,128,0.08); }
.phase-pill.p3 { color: var(--p3); border-color: var(--p3); background: rgba(251,146,60,0.08); }
.phase-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
}
.phase-line { flex: 1; height: 1px; background: var(--border); }
.phase-weeks-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  letter-spacing: 1px;
  white-space: nowrap;
}

/* ─── WEEK BLOCK ─── */
.week-block {
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.week-block.is-recovery { border-color: rgba(74,222,128,0.25); }
.week-block.week-done { border-color: rgba(56,189,248,0.4); }

.week-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: var(--card);
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.week-header:hover { background: var(--card-hover); }

.week-num-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  background: var(--border);
  padding: 3px 9px;
  border-radius: 4px;
  color: var(--muted);
}
.week-title {
  font-weight: 600;
  font-size: 15px;
  flex: 1;
}
.week-title-block { flex: 1; min-width: 0; }
.week-focus {
  font-size: 12px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}
.week-date {
  font-size: 11px;
  color: var(--muted2);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
}
.week-progress-mini {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.dots { display: flex; gap: 3px; }
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.2s;
}
.dot.done { background: var(--green); }
.week-chevron {
  font-size: 12px;
  color: var(--muted2);
  transition: transform 0.25s;
}
.week-block.open .week-chevron { transform: rotate(180deg); }
.recovery-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--green);
  border: 1px solid rgba(74,222,128,0.3);
  padding: 2px 6px;
  border-radius: 3px;
}
.race-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--orange);
  border: 1px solid rgba(251,146,60,0.4);
  padding: 2px 6px;
  border-radius: 3px;
}

/* ─── SESSIONS ─── */
.week-body {
  display: none;
  padding: 0 18px 18px;
  background: var(--bg2);
  flex-direction: column;
  gap: 12px;
}
.week-block.open .week-body { display: flex; }

.session-card {
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
  transition: border-color 0.2s, opacity 0.2s;
  margin-top: 12px;
}
.session-card.completed {
  border-color: rgba(74,222,128,0.4);
  opacity: 0.75;
}
.session-card.completed .session-top { background: rgba(74,222,128,0.06); }

.session-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--card);
  cursor: pointer;
}
.session-type-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.s-endurance .session-type-dot { background: var(--accent); }
.s-technique .session-type-dot { background: #a78bfa; }
.s-long .session-type-dot { background: var(--green); }
.s-intervals .session-type-dot { background: var(--orange); }
.s-race .session-type-dot { background: var(--red); }

.session-top-text { flex: 1; }
.session-name {
  font-weight: 600;
  font-size: 14px;
}
.session-subtitle {
  font-size: 11px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 1px;
}
.session-dist-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  padding: 3px 8px;
  background: var(--accent-dim);
  border-radius: 4px;
}
.check-btn {
  width: 28px; height: 28px;
  min-width: 44px; min-height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  font-size: 13px;
  color: transparent;
}
.check-btn:hover { border-color: var(--green); color: var(--green); }
.session-card.completed .check-btn {
  background: var(--green);
  border-color: var(--green);
  color: #0a1a0f;
}
.uncheck-btn {
  width: 28px; height: 28px;
  min-width: 44px; min-height: 44px;
  border-radius: 50%;
  border: 2px solid var(--red);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  font-size: 14px;
  color: var(--red);
  opacity: 0.7;
}
.uncheck-btn:hover {
  background: var(--red);
  color: #fff;
  opacity: 1;
}
.skip-btn {
  width: 28px; height: 28px;
  min-width: 44px; min-height: 44px;
  border-radius: 50%;
  border: 2px solid var(--muted2);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  font-size: 12px;
  color: var(--muted2);
}
.skip-btn:hover { border-color: var(--orange); color: var(--orange); }
.unskip-btn {
  width: 28px; height: 28px;
  min-width: 44px; min-height: 44px;
  border-radius: 50%;
  border: 2px solid var(--orange);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  font-size: 12px;
  color: var(--orange);
  opacity: 0.8;
}
.unskip-btn:hover { background: var(--orange); color: #1a0800; opacity: 1; }
.session-card.skipped { opacity: 0.5; border-color: rgba(251,146,60,0.3); }
.session-card.skipped .session-top { background: rgba(251,146,60,0.05); }
.session-card.skipped .session-name::after {
  content: ' — SKIPPÉE';
  font-size: 10px;
  color: var(--orange);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
}

/* ─── SESSION DETAIL ─── */
.session-detail {
  padding: 14px 16px;
  background: var(--bg);
  display: none;
  flex-direction: column;
  gap: 12px;
  border-top: 1px solid var(--border);
}
.session-card.open .session-detail { display: flex; }
.week-session-card.open .session-detail {
  display: flex;
  margin: 10px -2px -2px;
  border-radius: 6px;
}
.week-session-card.open .session-expand-icon { transform: rotate(180deg); }
.session-card.open .session-expand-icon { transform: rotate(180deg); }
.session-expand-icon {
  font-size: 10px;
  color: var(--muted2);
  transition: transform 0.2s;
  margin-left: 4px;
}

/* Warmup / main / cooldown blocks */
.phase-group { display: flex; flex-direction: column; gap: 6px; }
.phase-group-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 2px;
}
.set-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 10px;
  background: var(--card);
  border-radius: 6px;
  border-left: 3px solid transparent;
}
.set-row.warm { border-color: #fbbf24; }
.set-row.main { border-color: var(--accent); }
.set-row.interval { border-color: var(--orange); }
.set-row.drill { border-color: #a78bfa; }
.set-row.cool { border-color: var(--muted2); }
.set-row.long { border-color: var(--green); }

.set-dist {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.08);
  padding: 3px 7px;
  border-radius: 4px;
  color: rgba(255, 255, 255, 0.65);
  align-self: flex-start;
  line-height: 1.5;
  letter-spacing: 0.02em;
}

.set-body {
  flex: 1;
  min-width: 0;
}
.set-desc { font-size: 13px; font-weight: 500; color: var(--text); }
.set-desc-intro { font-size: 12px; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
.set-exercise-list { display: flex; flex-direction: column; gap: 4px; }
.set-exercise-item { font-size: 12px; line-height: 1.4; padding-left: 8px; border-left: 2px solid var(--border); color: var(--text); }
.set-tip {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 3px;
  line-height: 1.5;
}
.nage-tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 3px;
  margin-right: 4px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.crawl  { background: rgba(56,189,248,0.18); color: var(--accent); border: 1px solid rgba(56,189,248,0.3); }
.brasse { background: rgba(74,222,128,0.15); color: var(--green);  border: 1px solid rgba(74,222,128,0.3); }
.mixte  { background: rgba(251,146,60,0.15); color: var(--orange); border: 1px solid rgba(251,146,60,0.3); }

.session-tip-box {
  background: rgba(56,189,248,0.06);
  border: 1px solid rgba(56,189,248,0.15);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}
.session-tip-box strong { color: var(--accent); }

.session-note-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
}
.session-note-label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 7px;
}
.session-note-input {
  width: 100%;
  min-height: 68px;
  resize: vertical;
  font-family: inherit;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 9px;
}
.session-note-input::placeholder { color: var(--muted2); }
.session-note-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-color: var(--accent);
}
.note-indicator {
  display: inline-flex;
  align-items: center;
  margin-left: 4px;
  font-size: 12px;
  vertical-align: middle;
}
.session-result-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin-top: 8px;
}
.session-result-input {
  width: 100%;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
}
.session-result-input::placeholder { color: var(--muted2); }
.session-result-input:focus {
  outline: 2px solid var(--green);
  outline-offset: 2px;
  border-color: var(--green);
}
.session-result-estimate {
  display: none;
  margin-top: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--green);
  background: var(--green-dim);
  border-radius: 4px;
  padding: 5px 9px;
}
.session-result-estimate.visible { display: block; }
.result-indicator {
  display: inline-flex;
  align-items: center;
  margin-left: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--green);
  vertical-align: middle;
}

/* ─── STATS BAR ─── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 28px;
}
@media(max-width:600px){ .stats-bar { grid-template-columns: repeat(3,1fr); } }
@media(max-width:480px){
  .stats-bar { grid-template-columns: repeat(2,1fr); }
  .stat-box { padding: 12px 10px; }
  .stat-box .val { font-size: 24px; }
  .stat-box .lbl { font-size: 10px; }
}
.stat-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.stat-box .val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--accent);
  line-height: 1;
}
.stat-box .lbl {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
  font-family: 'JetBrains Mono', monospace;
}

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--green);
  color: #051008;
  font-family: 'Outfit', sans-serif;
  font-weight: 600;
  font-size: 14px;
  padding: 10px 20px;
  border-radius: 99px;
  transition: transform 0.35s cubic-bezier(.4,0,.2,1);
  z-index: 999;
  white-space: normal;
  pointer-events: none;
  max-width: calc(100vw - 32px);
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ─── BIKE SESSIONS ─── */
.v-endurance .session-type-dot { background: #facc15; }
.v-quality .session-type-dot { background: #f97316; }
.v-long .session-type-dot { background: #22d3ee; }
.v-race .session-type-dot { background: var(--red); }
.bike-dist-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: #facc15;
  padding: 3px 8px;
  background: rgba(250,204,21,0.12);
  border-radius: 4px;
}

/* ─── RUNNING SESSIONS ─── */
.r-easy .session-type-dot { background: #a3e635; }
.r-quality .session-type-dot { background: #f472b6; }
.r-long .session-type-dot { background: #818cf8; }
.r-race .session-type-dot { background: var(--red); }
.run-dist-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: #a3e635;
  padding: 3px 8px;
  background: rgba(163,230,53,0.12);
  border-radius: 4px;
}
.sport-tab { display: none; }
.sport-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 7px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
}
.sport-btn:focus-visible,
.week-nav-btn:focus-visible,
.check-btn:focus-visible,
.uncheck-btn:focus-visible,
.skip-btn:focus-visible,
.unskip-btn:focus-visible,
.wsc-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.sport-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.sport-btn.run-active { border-color: #a3e635; color: #a3e635; background: rgba(163,230,53,0.1); }
.sport-btn.bike-active { border-color: #facc15; color: #facc15; background: rgba(250,204,21,0.1); }
.program-date-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 16px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
}
.program-date-copy {
  min-width: 0;
}
.program-date-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 3px;
}
.program-date-status {
  font-size: 13px;
  color: var(--text);
}
.program-date-status span {
  color: var(--accent);
  font-weight: 600;
}
.program-date-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.program-date-actions input {
  color-scheme: dark;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg2);
  padding: 7px 9px;
}
.program-date-actions button {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 7px 11px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--muted);
  cursor: pointer;
}
.program-date-actions button:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.program-date-actions .primary {
  border-color: rgba(56,189,248,0.45);
  color: var(--accent);
  background: var(--accent-dim);
}
.week-title-date {
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 400;

}
@media(max-width: 650px) {
  .program-date-panel {
    align-items: flex-start;
    flex-direction: column;
  }
  .program-date-actions {
    justify-content: flex-start;
  }
}

/* ── SNAPSHOTS PANEL (bottom sheet) ── */
#snapshots-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 900; touch-action: none;
}
#snapshots-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-top: 1px solid var(--border);
  border-radius: 14px 14px 0 0; z-index: 901;
  max-height: 70vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1);
}
#snapshots-panel.open { transform: translateY(0); }
.snapshots-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 10px auto 0;
}
.snapshots-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
}
.snapshots-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted2);
}
.snapshots-close-btn {
  background: none; border: none; color: var(--muted);
  font-size: 16px; cursor: pointer; padding: 4px 8px; line-height: 1;
  min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
}
.snapshots-body {
  overflow-y: auto; padding: 12px 16px 24px; flex: 1;
}
.snapshot-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
}
.snapshot-item:last-child { border-bottom: none; }
.snapshot-info { display: flex; flex-direction: column; gap: 3px; }
.snapshot-date {
  font-size: 14px; color: var(--text); font-family: 'Outfit', sans-serif;
}
.snapshot-summary {
  font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace;
}
.snapshot-restore-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.8px; text-transform: uppercase;
  padding: 8px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg2);
  color: var(--muted); white-space: nowrap;
  min-height: 44px; min-width: 44px;
}
.snapshot-restore-btn:hover { border-color: var(--muted); color: var(--text); }
.snapshots-empty {
  text-align: center; color: var(--muted); font-size: 13px;
  font-family: 'Outfit', sans-serif; padding: 24px 0;
}

/* ── SNAPSHOT CONFIRM MODAL ── */
#snapshot-confirm-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  z-index: 950; touch-action: none;
}
#snapshot-confirm-modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; z-index: 951;
  width: min(90vw, 360px); padding: 24px 20px 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.snapshot-modal-title {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text); font-weight: 600;
}
.snapshot-modal-body {
  font-family: 'Outfit', sans-serif; font-size: 14px;
  color: var(--muted); line-height: 1.5;
}
.snapshot-modal-actions {
  display: flex; gap: 10px; justify-content: flex-end;
}
.snapshot-modal-cancel {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.8px; text-transform: uppercase;
  padding: 10px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg2);
  color: var(--muted); min-height: 44px;
}
.snapshot-modal-confirm {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.8px; text-transform: uppercase;
  padding: 10px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--red); background: rgba(248,113,113,0.12);
  color: var(--red); min-height: 44px;
}
.snapshot-modal-confirm:hover { background: rgba(248,113,113,0.22); }

/* ─── VUE SEMAINE ─── */
.week-view-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
}
.week-nav-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 12px 20px;
  min-height: 48px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
}
.week-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.week-nav-btn:disabled { opacity: 0.3; cursor: default; }
.wv-today-btn { font-size: 12px; padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,0.08); color: var(--fg); border: none; cursor: pointer; }
.week-nav-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
  color: var(--text);
  text-align: center;
  flex: 1;
}
.week-nav-title span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  display: block;
  letter-spacing: 1px;
  margin-top: 2px;
  font-weight: 400;
}
.week-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;

}
@media(max-width: 700px) {
  .week-grid { grid-template-columns: 1fr; }
}
.sport-column {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sport-col-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  margin-bottom: 4px;
}
.sport-col-header .sport-emoji { font-size: 16px; }
.sport-col-header .sport-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 1px;
}
.sport-col-header .sport-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
}
.week-session-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
}
.week-session-card:hover { background: var(--card-hover); }
.week-session-card.wc-swim { border-left-color: var(--accent); }
.week-session-card.wc-bike { border-left-color: #facc15; }
.week-session-card.wc-run  { border-left-color: #a3e635; }
.week-session-card.wc-done { opacity: 0.55; }
.week-session-card.wc-skipped { opacity: 0.4; }
.week-session-card.wc-optional { border-style: dashed; }
.wsc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.wsc-name {
  font-size: 12px;
  font-weight: 600;
  flex: 1;
  line-height: 1.3;
}
.wsc-name.done-text { text-decoration: line-through; color: var(--muted); }
.wsc-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  flex-shrink: 0;
}
.wsc-badge.swim  { background: rgba(56,189,248,0.15);  color: var(--accent); }
.wsc-badge.bike  { background: rgba(250,204,21,0.15);  color: #facc15; }
.wsc-badge.run   { background: rgba(163,230,53,0.15);  color: #a3e635; }
.wsc-badge.str   { background: rgba(192,132,252,0.15); color: #c084fc; }
.wsc-badge.brick { background: rgba(251,146,60,0.15);  color: #fb923c; }
.wsc-meta {
  font-size: 11px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}
.wsc-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  justify-content: flex-end;
}
.wsc-btn {
  font-size: 11px;
  padding: 10px 14px;
  min-height: 44px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'JetBrains Mono', monospace;
}
.wsc-btn.check { color: var(--green); border-color: var(--green); }
.wsc-btn.check:hover { background: var(--green); color: #051008; }
.wsc-btn.uncheck { color: var(--red); border-color: var(--red); }
.wsc-btn.uncheck:hover { background: var(--red); color: #fff; }
.wsc-btn.skip { color: var(--muted); border-color: var(--muted2); }
.wsc-btn.skip:hover { color: var(--orange); border-color: var(--orange); }
.wsc-btn.unskip { color: var(--orange); border-color: var(--orange); }
.wsc-btn.unskip:hover { background: var(--orange); color: #fff; }
.wsc-btn.detail { color: var(--muted); border-color: var(--muted2); }
.wsc-btn.detail:hover { color: var(--accent); border-color: var(--accent); }
.week-summary-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
@media(max-width:500px){ .week-summary-bar { grid-template-columns: repeat(2,1fr); } }
.wsb-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  text-align: center;
}
.wsb-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--accent);
  line-height: 1;
}
.wsb-lbl {
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
}
.empty-sport {
  padding: 16px;
  text-align: center;
  color: var(--muted2);
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  border: 1px dashed var(--border);
  border-radius: 8px;
}
.week-view-active-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--accent);
  border: 1px solid rgba(56,189,248,0.4);
  padding: 2px 6px;
  border-radius: 3px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

/* ─── PERF SHEET ─── */
#perf-backdrop {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.72); z-index: 799;
}
#perf-sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #131d2e; border-radius: 16px 16px 0 0;
  max-height: 88vh; overflow: hidden; z-index: 800;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(.4,0,.2,1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#perf-sheet.open { transform: translateY(0); }
.perf-handle {
  width: 36px; height: 4px; background: #1c2d44;
  border-radius: 99px; margin: 10px auto 0;
}
.perf-header {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
  padding: 12px 16px;
}
.perf-discipline-label {
  display: block; font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 600;
}
.perf-session-name {
  display: block; font-family: 'DM Sans', sans-serif;
  font-size: 12px; color: #5a7a99; margin-top: 2px;
}
.perf-close-btn {
  min-width: 44px; min-height: 44px; display: flex;
  align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer;
  color: #5a7a99; font-family: 'JetBrains Mono', monospace;
  font-size: 18px; flex-shrink: 0;
}
.perf-body {
  overflow-y: auto; padding: 16px 16px 0;
  -webkit-overflow-scrolling: touch;
  max-height: calc(88vh - 54px - 72px);
}
.perf-field-label {
  font-family: 'DM Sans', sans-serif; font-size: 11px;
  font-weight: 500; color: #5a7a99; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 10px;
}
.perf-sep {
  height: 1px; background: #1c2d44; margin: 16px 0;
}
.rpe-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
}
.rpe-btn {
  min-height: 52px; border-radius: 8px;
  border: 1px solid #1c2d44; background: #111827;
  color: #5a7a99; font-family: 'JetBrains Mono', monospace;
  font-size: 18px; font-weight: 700; cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
}
.rpe-btn:active { transform: scale(0.94); }
.rpe-btn.selected { color: #07090f; }
.rpe-label-zone {
  height: 22px; text-align: center; margin-top: 10px;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  font-style: italic;
}
.perf-actions {
  display: flex; gap: 12px; align-items: center;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid #1c2d44; background: #131d2e;
}
.perf-btn-cancel {
  min-width: 80px; min-height: 56px; background: transparent;
  border: 1px solid #1c2d44; border-radius: 8px;
  color: #5a7a99; font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500; cursor: pointer;
}
.perf-btn-submit {
  flex: 1; height: 56px; border: none; border-radius: 8px;
  color: #07090f; font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; letter-spacing: 1px; cursor: pointer;
  opacity: 1; transition: opacity 0.15s;
}
.perf-btn-submit:disabled { opacity: 0.45; cursor: not-allowed; }
.perf-metric-block { margin-bottom: 16px; }
.perf-label-row {
  display: flex; justify-content: space-between;
  align-items: baseline; margin-bottom: 6px;
}
.perf-label-row-left {
  font-family: 'DM Sans', sans-serif; font-size: 11px;
  color: #5a7a99; text-transform: uppercase; letter-spacing: 1px;
}
.perf-label-row-right {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5a7a99;
}
.perf-optional-tag {
  font-family: 'DM Sans', sans-serif; font-size: 9px;
  padding: 2px 6px; border-radius: 4px;
  background: #0d1117; border: 1px solid #1c2d44; color: #5a7a99;
}
.perf-input-wrap { position: relative; }
.perf-input {
  width: 100%; height: 52px; background: #111827;
  border: 1px solid #1c2d44; border-radius: 8px;
  color: #e2eaf4; font-family: 'JetBrains Mono', monospace;
  font-size: 18px; font-weight: 600; text-align: right;
  padding: 0 32px 0 12px; box-sizing: border-box;
  transition: border-color 0.15s;
}
.perf-input:focus { outline: none; }
.perf-input-suffix {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%); pointer-events: none;
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: #5a7a99;
}
.perf-diff {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px; font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 600;
}
.perf-diff-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.perf-pace-group {
  display: flex; align-items: center; gap: 8px;
}
.perf-pace-input {
  width: 64px; height: 52px; background: #111827;
  border: 1px solid #1c2d44; border-radius: 8px;
  color: #e2eaf4; font-family: 'JetBrains Mono', monospace;
  font-size: 18px; font-weight: 600; text-align: center;
  transition: border-color 0.15s;
}
.perf-pace-input:focus { outline: none; }
.perf-pace-sep {
  font-family: 'DM Sans', sans-serif; font-size: 20px;
  font-weight: 600; color: #5a7a99; flex-shrink: 0;
}
.perf-pace-suffix {
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  color: #5a7a99; margin-left: 4px;
}
.perf-2col {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.perf-slider-wrap { height: 44px; display: flex; align-items: center; }
.perf-slider {
  -webkit-appearance: none; width: 100%; height: 6px;
  border-radius: 99px; outline: none; cursor: pointer;
  background: #1c2d44;
}
.perf-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px;
  border-radius: 50%; border: 2px solid #131d2e; cursor: pointer;
  background: #e2eaf4;
}
.perf-slider-values {
  text-align: center; margin-top: 6px;
  font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;
}
.perf-textarea {
  width: 100%; height: 80px; background: #111827;
  border: 1px solid #1c2d44; border-radius: 8px;
  color: #e2eaf4; font-family: 'DM Sans', sans-serif;
  font-size: 14px; line-height: 1.5; padding: 10px 12px;
  box-sizing: border-box; resize: none; overflow: hidden;
  transition: border-color 0.15s;
}
.perf-textarea:focus { outline: none; }
.wsc-results-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px; overflow: hidden; flex-wrap: nowrap;
}
.wsc-rpe-badge {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 3px 8px; border-radius: 99px; height: 24px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  font-weight: 700; flex-shrink: 0; white-space: nowrap;
}
.wsc-summary-line {
  flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
  font-size: 11px;
}
.sum-val {
  font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #e2eaf4;
}
.sum-label { font-family: 'DM Sans', sans-serif; color: #5a7a99; }
.sum-sep { font-family: 'DM Sans', sans-serif; color: #3a5570; }
.wsc-edit-btn {
  min-width: 44px; min-height: 44px; display: flex;
  align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer;
  color: #3a5570; transition: color 0.15s; flex-shrink: 0;
}
.wsc-edit-btn:active { color: #5a7a99; }
.wsc-add-perf-link {
  font-family: 'DM Sans', sans-serif; font-size: 11px;
  cursor: pointer; text-decoration: underline; color: #5a7a99;
}

.recap-handle {

}
.recap-header {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 12px 16px 8px;
}
.recap-title {
  font-family: 'Bebas Neue', sans-serif;

.recap-grid {

.recap-cell {

function validatePlan() {
  const validPrefixes = ['sw', 'brw', 'bw', 'rw', 'mw'];
  const seenIds = new Set();
  const requiredFields = ['id', 'name', 'type', 'dist', 'sets'];
  weeklyPlan.forEach(w => {
    w.sessions.forEach(s => {
      if (seenIds.has(s.id)) console.warn(`[validatePlan] ID dupliqué : ${s.id}`);
      seenIds.add(s.id);
      if (!validPrefixes.some(p => s.id.startsWith(p)))
        console.warn(`[validatePlan] Préfixe inconnu : ${s.id}`);
      requiredFields.forEach(f => {
        if (s[f] === undefined) console.warn(`[validatePlan] Champ manquant "${f}" sur ${s.id}`);
      });
    });
  });
}

let _corruptionDetected = false;

function loadStoredState(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || '{}');
    return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
  } catch {
    localStorage.removeItem(key);
    _corruptionDetected = true;
    return {};
  }
}

// Reset v17 : nouveau cycle (semi-marathon du 11/10) — purge complète de la progression Half Ironman
const PLAN_VERSION = 'semi-2026-10-11';
if (localStorage.getItem('hi_tri_plan_version') !== PLAN_VERSION) {
  Object.values(STORE).forEach(k => localStorage.removeItem(k));
  localStorage.removeItem('hi_tri_adapted_v1');
  localStorage.removeItem('hi_tri_checkin_v1');
  localStorage.removeItem('hi_tri_race_checklist_v1');
  localStorage.setItem('hi_tri_plan_version', PLAN_VERSION);
}

let completed    = loadStoredState(STORE.completed);
let skipped      = loadStoredState(STORE.skipped);
let sessionNotes = loadStoredState(STORE.notes);
let sessionResults = loadStoredState(STORE.results);
let perfResults  = loadStoredState(STORE.perfResults);

var adapted = {};
(function() {
  try { adapted = JSON.parse(localStorage.getItem('hi_tri_adapted_v1') || '{}'); } catch(e) { adapted = {}; }
})();

function safeWrite(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    if (e && e.name === 'QuotaExceededError') {
      showToast('storage-quota');
    } else {
      console.warn('[HIPLAN] localStorage.setItem échoué :', key, e);
    }
    return false;
  }
}

function save() {
  safeWrite(STORE.completed,   JSON.stringify(completed));
  safeWrite(STORE.skipped,     JSON.stringify(skipped));
  safeWrite(STORE.notes,       JSON.stringify(sessionNotes));
  safeWrite(STORE.results,     JSON.stringify(sessionResults));
  safeWrite(STORE.perfResults, JSON.stringify(perfResults));
}

const WEEK_PHASES = [
  { phase: 1, name: 'REPRISE',      weeks: [1] },
  { phase: 2, name: 'CONSTRUCTION', weeks: [2, 3] },
  { phase: 3, name: 'SPÉCIFIQUE',   weeks: [4] },
  { phase: 4, name: 'AFFÛTAGE',     weeks: [5] },
  { phase: 5, name: 'COURSE',       weeks: [6] },
];

function addDays(date, days) {
  const result = new Date(date);
  result.setDate(result.getDate() + days);
  return result;
}

function parseIsoLocalDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return null;
  const [year, month, day] = value.split('-').map(Number);
  const date = new Date(year, month - 1, day);
  return Number.isNaN(date.getTime()) ? null : date;
}

function toIsoLocalDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

const DEFAULT_PROGRAM_END = '2026-10-11';

function getProgramEndDate() {
  const storedEnd = parseIsoLocalDate(localStorage.getItem(STORE.programEnd));
  if (storedEnd) return storedEnd;

  const legacyStart = parseIsoLocalDate(localStorage.getItem(STORE.legacyStart));
  if (legacyStart) {
    const migratedEnd = addDays(legacyStart, (TOTAL_WEEKS * 7) - 1);
    localStorage.setItem(STORE.programEnd, toIsoLocalDate(migratedEnd));
    return migratedEnd;
  }

  // Fallback : programme non configuré → date de course par défaut
  const defaultEnd = parseIsoLocalDate(DEFAULT_PROGRAM_END);
  return defaultEnd;
}

function getRaceDate() {
  const programEnd = getProgramEndDate();
  if (!programEnd) return null;
  // La course est le dernier jour de RACE_WEEK.
  // programEnd est le dernier jour de TOTAL_WEEKS.
  // Offset = (TOTAL_WEEKS - RACE_WEEK) semaines en arrière.
  return addDays(programEnd, -(TOTAL_WEEKS - RACE_WEEK) * 7);
}

function getProgramStartDate() {
  const programEnd = getProgramEndDate();
  return programEnd ? addDays(programEnd, -((TOTAL_WEEKS * 7) - 1)) : null;
}

function formatDateShort(date) {
  return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }).replace('.', '');
}

function getWeekDateRange(weekNum) {
  const range = getWeekDateRangeDates(weekNum);
  if (!range) return 'fin à définir';
  return formatWeekDateRange(range.start, range.end);
}

function formatWeekDateRange(start, end) {
  const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
  if (sameMonth) {
    return `${start.getDate()}–${formatDateShort(end)}`;
  }
  return `${formatDateShort(start)} – ${formatDateShort(end)}`;
}

function getWeekDateRangeDates(weekNum) {
  const programStart = getProgramStartDate();
  if (!programStart) return null;
  // Convention calendrier : la date choisie est le dernier jour de la dernière semaine (TOTAL_WEEKS).
  // La semaine 1 commence donc TOTAL_WEEKS*7-1 jours avant cette date, puis chaque semaine dure 7 jours.
  const start = addDays(programStart, (weekNum - 1) * 7);
  const end = addDays(start, 6);
  return { start, end };
}

function startOfToday() {
  const today = new Date();
  return new Date(today.getFullYear(), today.getMonth(), today.getDate());
}

function getCalendarActiveWeekNum() {
  const programStart = getProgramStartDate();
  const programEnd = getProgramEndDate();
  if (!programStart || !programEnd) return 1;
  const today = startOfToday();
  if (today <= programStart) return 1;
  if (today >= programEnd) return TOTAL_WEEKS;
  const diffDays = Math.round((today - programStart) / 86_400_000);
  return Math.min(TOTAL_WEEKS, Math.floor(diffDays / 7) + 1);
}

function renderProgramEndControl(editing = false) {
  const input = document.getElementById('programEndInput');
  const saveBtn = document.getElementById('programEndSaveBtn');
  const editBtn = document.getElementById('programEndEditBtn');
  const status = document.getElementById('program-date-status');
  if (!input || !saveBtn || !editBtn || !status) return;

  const storedIso = localStorage.getItem(STORE.programEnd);
  const legacyIso = localStorage.getItem(STORE.legacyStart);
  const programEnd = getProgramEndDate();
  const programStart = getProgramStartDate();
  const shouldEdit = editing || !programEnd;
  input.value = programEnd ? toIsoLocalDate(programEnd) : '';
  input.style.display = shouldEdit ? '' : 'none';
  saveBtn.style.display = shouldEdit ? '' : 'none';
  editBtn.style.display = shouldEdit ? 'none' : '';

  if (!programEnd || !programStart) {
    if (storedIso) localStorage.removeItem(STORE.programEnd);
    if (legacyIso) localStorage.removeItem(STORE.legacyStart);
    status.textContent = 'Définis une date de fin pour caler les 3 semaines.';
    return;
  }

  const activeWeek = getCalendarActiveWeekNum();
  status.innerHTML = `Fin cible <span>${formatDateShort(programEnd)}</span> · début calculé ${formatDateShort(programStart)} · semaine calendaire <span>S${activeWeek}</span>`;
}

function updateHeaderSubtitle() {
  const el = document.getElementById('header-subtitle');
  if (!el) return;
  const raceDate = getRaceDate();
  if (!raceDate) {
    el.textContent = '// Mon plan d\'entrainement';
    return;
  }
  const raceDateDay = new Date(raceDate.getFullYear(), raceDate.getMonth(), raceDate.getDate());
  const diffDays = Math.round((raceDateDay - startOfToday()) / 86_400_000);
  const activeWeek = getCalendarActiveWeekNum();
  const phase = getWeekPhase(activeWeek);

  let full, compact;
  if (diffDays < 0) {
    // Course terminée — afficher la phase en cours (récupération) sans countdown négatif
    full    = '// ' + phase.name + ' · SEMAINE ' + activeWeek + '/' + TOTAL_WEEKS;
    compact = '// ' + phase.name + ' · S' + activeWeek + '/' + TOTAL_WEEKS;
  } else if (diffDays === 0) {
    full    = '// JOUR J · ' + phase.name + ' · SEMAINE ' + activeWeek + '/' + TOTAL_WEEKS;
    compact = '// JOUR J · ' + phase.name + ' · S' + activeWeek + '/' + TOTAL_WEEKS;
  } else {
    full    = '// J-' + diffDays + ' · ' + phase.name + ' · SEMAINE ' + activeWeek + '/' + TOTAL_WEEKS;
    compact = '// J-' + diffDays + ' · ' + phase.name + ' · S' + activeWeek + '/' + TOTAL_WEEKS;
  }

  el.textContent = full;
  if (el.scrollWidth > el.clientWidth) {
    el.textContent = compact;
  }

  // Lot 2 + Lot 4 — bouton fiche course et accent orange race week
  var raceBtn = document.getElementById('header-race-btn');
  if (raceDate && diffDays >= 0 && diffDays <= 7) {
    if (raceBtn) raceBtn.style.display = 'inline-block';
    el.style.color = 'var(--orange)';
  } else {
    if (raceBtn) raceBtn.style.display = 'none';
    el.style.color = '';
  }
}

function secondsToMmss(s) {
  const m = Math.floor(s / 60);
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}

function getWeekSessions(weekNum) {
  const week = weeklyPlan.find(w => w.weekNum === weekNum);
  if (!week) return { swim: [], bike: [], run: [], str: [], brick: [] };
  const result = { swim: [], bike: [], run: [], str: [], brick: [] };
  week.sessions.forEach(s => {
    const disc = getDiscipline(s.id);
    if (disc && result[disc]) result[disc].push(s);
  });
  return result;
}

function getWeekPhase(weekNum) {
  return WEEK_PHASES.find(phase => phase.weeks.includes(weekNum)) || WEEK_PHASES[0];
}

function getWeekLabel(weekNum) {

}

function getDistLabel(session, disciplineKey) {
  const config = DISCIPLINE_CONFIG[disciplineKey] || DISCIPLINE_CONFIG.swim;

}

function getSessionDisplayName(session) {
  return session.name.replace(/^[A-Z]\d+\s+—\s+/, '');

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getSessionNote(id) {
  return typeof sessionNotes[id] === 'string' ? sessionNotes[id] : '';
}

function formatSetDesc(desc) {
  const lines = desc.split('\n');
  const introLines = [];
  const exerciseLines = [];
  let inExercises = false;
  for (const line of lines) {
    if (/^\d+\./.test(line.trim())) { inExercises = true; exerciseLines.push(line.trim()); }
    else if (inExercises) { exerciseLines.push(line.trim()); }
    else { introLines.push(line); }
  }
  const introHtml = introLines.length ? `<div class="set-desc-intro">${introLines.join('<br>')}</div>` : '';
  const listHtml = exerciseLines.length
    ? `<div class="set-exercise-list">${exerciseLines.map(l => `<span class="set-exercise-item">${l}</span>`).join('')}</div>`
    : '';
  return introHtml + listHtml || escapeHtml(desc);
}

    return '<tr><td class="nb-time">' + row.time + '</td><td class="nb-content">' + row.content + '</td></tr>';

    return '<li class="nb-note">' + note + '</li>';

    + '<div class="nb-header" onclick="document.getElementById(\'' + bannerId + '\').classList.toggle(\'nb-open\')">'

function buildMissedSessionSheet() {
  var raison = document.querySelector('#missed-sheet input[name="missed-raison"]:checked');
  var delai  = document.querySelector('#missed-sheet input[name="missed-delai"]:checked');
  var raisonVal = raison ? raison.value : null;
  var delaiVal  = delai  ? delai.value  : null;
  var advEl = document.getElementById('missed-advice-text');
  if (!advEl) return;
  if (!raisonVal || !delaiVal) {
    advEl.textContent = 'Sélectionne une raison et un délai pour voir la recommandation.';
    advEl.style.display = 'block';
    return;
  }
  var key = raisonVal + '-' + delaiVal;
  var advice = MISSED_ADVICE[key] || 'Évalue la situation et reprends selon tes sensations.';
  // Semaine d\'affûtage (S6) ou semaine course (S7) — ajoute la note taper sauf si douleur
  var activeWeek = getCalendarActiveWeekNum();
  if ((activeWeek === 6 || activeWeek === 7) && raisonVal !== 'douleur') {
    advice += ' ' + MISSED_TAPER_NOTE;
  }
  advEl.textContent = advice;
  advEl.style.display = 'block';
}

function buildSessionCard(session, disciplineKey) {
  const config = DISCIPLINE_CONFIG[disciplineKey] || DISCIPLINE_CONFIG.swim;
  const isDone = !!completed[session.id];
  const isSkipped = !!skipped[session.id];
  const isAdapted = isOpenWaterSession(session.id) && !!adapted[session.id];
  const isOptional = session.typeLabel && session.typeLabel.includes('Optionnel');
  const hasNote = getSessionNote(session.id).trim().length > 0;
  const noteIndicator = hasNote ? `<span class="note-indicator" title="Note enregistrée">📝</span>` : '';
  const result = getSessionResult(session.id).trim();
  const resultIndicator = result ? `<span class="result-indicator" title="Résultat">⏱ ${escapeHtml(result)}</span>` : '';
  const adaptedBadge = isAdapted ? '<span class="wsc-badge-adapted">ADAPTÉ</span>' : '';
  let actionBtns = '';
  if (isDone) {
    actionBtns = `<button class="wsc-btn uncheck" onclick="event.stopPropagation(); wvToggleDone('${session.id}')">✕ Annuler</button>`;
  } else if (isSkipped) {
    actionBtns = `<button class="wsc-btn unskip" onclick="event.stopPropagation(); wvToggleSkip('${session.id}')">↩ Unskip</button>`;
  } else if (isAdapted) {
    actionBtns = `<button class="wsc-btn unadapted" onclick="event.stopPropagation(); toggleAdapted('${session.id}')">↩ Désadapter</button>`;
  } else {
    var adaptedBtn = isOpenWaterSession(session.id)
      ? `<button class="wsc-btn adapted" onclick="event.stopPropagation(); toggleAdapted('${session.id}')">~ Adapté</button>`
      : '';
    actionBtns = `
      <button class="wsc-btn check" onclick="event.stopPropagation(); wvToggleDone('${session.id}')">✓ Fait</button>
      <button class="wsc-btn skip" onclick="event.stopPropagation(); wvToggleSkip('${session.id}')">⏭ Skip</button>
      ${adaptedBtn}
    `;
  }

  return `
    <div class="week-session-card wc-${config.color}${isDone ? ' wc-done' : ''}${isSkipped ? ' wc-skipped' : ''}${isAdapted ? ' wc-adapted' : ''}${isOptional ? ' wc-optional' : ''}" id="week-card-${session.id}">
      <div class="wsc-top" role="button" tabindex="0" aria-expanded="false" onclick="toggleWeekSessionDetail('${session.id}')" onkeydown="handleWeekSessionKey(event, '${session.id}')">
        <div class="wsc-name ${isDone ? 'done-text' : ''}">${getSessionDisplayName(session)}${noteIndicator}${resultIndicator}${adaptedBadge} <span class="session-expand-icon">▾</span></div>
        <div class="wsc-badge ${config.color}">${getDistLabel(session, disciplineKey)}</div>
      </div>
      <div class="wsc-meta">${session.typeLabel || ''}</div>
      ${isDone ? buildPerfResultsRowHtml(session, disciplineKey) : ''}
      <div class="wsc-actions">${actionBtns}<button class="wsc-btn detail" onclick="event.stopPropagation(); openSessionHistorySheet('${session.id}')" aria-label="Historique de ce type de séance">Hist.</button></div>
      ${buildSessionDetailHtml(session, disciplineKey)}
    </div>
  `;
}

  if (raceDate) {
    var rd = new Date(raceDate.getFullYear(), raceDate.getMonth(), raceDate.getDate());
    diffDays = Math.round((rd - startOfToday()) / 86400000);
  }
  var defaultOpen = (diffDays >= 0 && diffDays <= 7);

  var allItems = RACE_CHECKLIST.flatMap(function(s) { return s.items; });
  var totalDone = allItems.filter(function(it) { return !!state[it.id]; }).length;

  var sectionsHtml = RACE_CHECKLIST.map(function(section) {
    var done = section.items.filter(function(it) { return !!state[it.id]; }).length;
    var itemsHtml = section.items.map(function(item) {
      var checked = !!state[item.id];
      return '<label class="rc-item-label" onclick="event.stopPropagation()">'
        + '<span id="rc-cb-' + item.id + '" class="rc-checkbox' + (checked ? ' rc-checked' : '') + '" onclick="toggleRaceChecklistItem(\'' + item.id + '\')" role="checkbox" aria-checked="' + checked + '" tabindex="0"></span>'
        + '<span class="rc-item-text">' + item.text + '</span>'
        + '</label>';
    }).join('');
    return '<div class="rc-section' + (defaultOpen ? ' rc-section-open' : '') + '">'
      + '<div class="rc-section-header" onclick="this.parentNode.classList.toggle(\'rc-section-open\')">'
      + '<span class="rc-section-title">' + section.title + '</span>'
      + '<span class="rc-section-count" id="rc-count-' + section.id + '">' + done + '/' + section.items.length + ' prêts</span>'
      + '<span class="rc-section-arrow">▾</span>'
      + '</div>'
      + '<div class="rc-section-body">' + itemsHtml + '</div>'
      + '</div>';
  }).join('');

  var card = document.createElement('div');
  card.className = 'rc-card' + (defaultOpen ? ' rc-open' : '');
  card.id = 'race-checklist-card';
  card.innerHTML = '<div class="rc-card-header" onclick="document.getElementById(\'race-checklist-card\').classList.toggle(\'rc-open\')">'
    + '<span class="rc-card-icon">🏁</span>'
    + '<div class="rc-card-title-block">'
    + '<span class="rc-card-title">CHECKLIST COURSE</span>'
    + '<span class="rc-card-subtitle">SEMI-MARATHON — 11 octobre 2026</span>'
    + '</div>'
    + '<span class="rc-total-count" id="rc-total-count">' + totalDone + '/' + allItems.length + ' prêts</span>'
    + '<button class="rc-fiche-btn" onclick="event.stopPropagation(); openRaceDaySheet()" aria-label="Ouvrir la fiche course">🏁 Fiche course</button>'
    + '<span class="rc-card-arrow">▾</span>'
    + '</div>'
    + '<div class="rc-card-body">' + sectionsHtml + '</div>';
  return card;
}

function buildWeekView(weekNum) {
  if (weekNum === null) weekNum = getCalendarActiveWeekNum();
  currentWeekView = weekNum;

  const container = document.getElementById('plan');
  container.innerHTML = '';

  const sessionsBySport = getWeekSessions(weekNum);
  const activeSports = Object.entries(sessionsBySport)
    .filter(([key, sessions]) => sessions.length > 0 && DISCIPLINE_CONFIG[key]);
  const allSessions = activeSports.flatMap(([, sessions]) => sessions);
  const doneCount = allSessions.filter(s => completed[s.id]).length;
  const skipCount = allSessions.filter(s => skipped[s.id]).length;
  const totalMinSwim  = (sessionsBySport.swim  || []).reduce((a,s) => a + (s.dist||0), 0);
  const totalMinBike  = (sessionsBySport.bike  || []).reduce((a,s) => a + (s.dist||0), 0);
  const totalMinRun   = (sessionsBySport.run   || []).reduce((a,s) => a + (s.dist||0), 0);
  const totalMinBrick = (sessionsBySport.brick || []).reduce((a,s) => a + (s.dist||0), 0);
  const totalStrength = (sessionsBySport.str   || []).length;
  const isActive = weekNum === getCalendarActiveWeekNum();
  const weekDateRange = getWeekDateRange(weekNum);
  const phase = getWeekPhase(weekNum);
  const phasePos   = phase.weeks.indexOf(weekNum) + 1;
  const phaseTotal = phase.weeks.length;

  // Nav bar
  const nav = document.createElement('div');
  nav.className = 'week-view-nav';
  nav.innerHTML = `
    <button class="week-nav-btn" onclick="buildWeekView(${weekNum - 1})" ${weekNum <= 1 ? 'disabled' : ''}>← ${weekNum > 1 ? 'S' + getWeekLabel(weekNum - 1) : 'Début'}</button>
	    <div class="week-nav-title">
	      SEMAINE ${getWeekLabel(weekNum)}
	      <span>${phase.name} · semaine ${phasePos}/${phaseTotal} · ${weekDateRange}${isActive ? ' · 📍 CETTE SEMAINE' : ''}</span>
	      ${weekNum !== getCalendarActiveWeekNum() ? `<button class="wv-today-btn" onclick="buildWeekView(getCalendarActiveWeekNum())">↩ Semaine active</button>` : ''}
	    </div>
	    <button class="week-nav-btn" onclick="buildWeekView(${weekNum + 1})" ${weekNum >= TOTAL_WEEKS ? 'disabled' : ''}>${weekNum < TOTAL_WEEKS ? 'S' + getWeekLabel(weekNum + 1) : 'Fin'} →</button>
	  `;
  container.appendChild(nav);

  // Summary bar
  const summary = document.createElement('div');
  summary.className = 'week-summary-bar';
  summary.innerHTML = `
	    <div class="wsb-item"><div class="wsb-val">${doneCount}/${allSessions.length}</div><div class="wsb-lbl">Séances</div></div>
	    <div class="wsb-item"><div class="wsb-val" style="color:#38bdf8">${totalMinSwim}min</div><div class="wsb-lbl">🏊 Natation</div></div>
	    <div class="wsb-item"><div class="wsb-val" style="color:#facc15">${totalMinBike}min</div><div class="wsb-lbl">🚴 Vélo</div></div>
	    <div class="wsb-item"><div class="wsb-val" style="color:#a3e635">${totalMinRun}min</div><div class="wsb-lbl">🏃 Running</div></div>
	    ${totalMinBrick ? `<div class="wsb-item"><div class="wsb-val" style="color:#fb923c">${totalMinBrick}min</div><div class="wsb-lbl">🧱 Brick</div></div>` : ''}
	    ${totalStrength ? `<div class="wsb-item"><div class="wsb-val" style="color:#c084fc">${totalStrength}</div><div class="wsb-lbl">💪 Muscu</div></div>` : ''}
	  `;
  container.appendChild(summary);

  // Grille hebdomadaire unifiée : chaque séance se déplie inline, sans navigation par onglet sport.
  const grid = document.createElement('div');
  grid.className = 'week-grid';

  activeSports.forEach(([disciplineKey, sessions]) => {
    const sport = DISCIPLINE_CONFIG[disciplineKey];
    const col = document.createElement('div');
    col.className = 'sport-column';

    const doneInSport = sessions.filter(s => completed[s.id]).length;
    col.innerHTML = `
      <div class="sport-col-header">
        <span class="sport-emoji">${sport.emoji}</span>
        <span class="sport-label">${sport.label}</span>
        <span class="sport-count">${doneInSport}/${sessions.length}</span>
      </div>
    `;

    if (sessions.length === 0) {
      col.innerHTML += `<div class="empty-sport">Pas de séance</div>`;
    } else {
      sessions.forEach(s => {
        col.insertAdjacentHTML('beforeend', buildSessionCard(s, disciplineKey));
      });
    }
    grid.appendChild(col);
  });

  container.appendChild(grid);
  if (weekNum === RACE_WEEK) {
    container.appendChild(buildRaceChecklistCard());
  }
}

function toggleAdapted(id) {
  var openCards = getOpenWeekSessionIds();
  if (adapted[id]) {
    delete adapted[id];
  } else {
    adapted[id] = true;
    delete completed[id];
    delete skipped[id];
    save();
  }
  safeWrite('hi_tri_adapted_v1', JSON.stringify(adapted));
  updateStats();
  buildWeekView(currentWeekView);
  restoreOpenWeekSessions(openCards);
  if (adapted[id]) {
    showToast('adapted');
  }
}

function wvToggleDone(id) {
  const openCards = getOpenWeekSessionIds();
  if (completed[id]) {
    delete completed[id];
    save();
    updateStats();
    buildWeekView(currentWeekView);
    restoreOpenWeekSessions(openCards);

    completed[id] = true;

}

// Les notes sont stockées hors du plan statique pour préserver les IDs et les données d'origine.
function saveSessionNote(id, value) {
  const nextNote = String(value || '').trim();
  const previousNote = getSessionNote(id).trim();
  if (nextNote === previousNote) return;
  if (nextNote) {
    sessionNotes[id] = nextNote;
  } else {
    delete sessionNotes[id];
  }
  save();
  updateSessionNoteIndicator(id);
  showToast('note-saved');
}

function getSessionResult(id) {
  return typeof sessionResults[id] === 'string' ? sessionResults[id] : '';
}

function parseTimeToSeconds(str) {
  const s = str.trim().replace(/h/gi, ':').replace(/['"]/g, ':').replace(/\s/g, '');
  const parts = s.split(':').map(Number);
  if (parts.some(isNaN) || parts.length < 2 || parts.length > 3) return null;
  return parts.length === 3
    ? parts[0] * 3600 + parts[1] * 60 + parts[2]
    : parts[0] * 60 + parts[1];
}

function formatSecondsToTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.round(s % 60);
  return h > 0
    ? `${h}h${String(m).padStart(2,'0')}'${String(sec).padStart(2,'0')}`
    : `${m}'${String(sec).padStart(2,'0')}`;
}

function calcEstimateHtml(value) {
  const secs = parseTimeToSeconds(value);
  if (!secs) return '';
  const semiSecs = Math.round(secs * 2.1);
  const paceSecs = Math.round(semiSecs / 21.097);
  return `→ Semi estimé : ~${formatSecondsToTime(semiSecs)} · allure ${formatSecondsToTime(paceSecs)}/km`;
}

function buildSessionResultHtml(session) {
  const qualityTypes = ['r-quality', 'r-race', 'r-threshold', 'r-tempo'];
  const isRaceByName = session.name && session.name.startsWith('RACE');
  if (!qualityTypes.includes(session.type) && !isRaceByName) return '';
  const result   = getSessionResult(session.id);
  const isTest10k = false;
  const placeholder = isTest10k
    ? 'Ex : 43:22 — estimation semi calculée automatiquement'
    : session.type === 'r-race'
      ? 'Temps final — ex : 1:29:45'
      : "Ex : 6×400m à 3'52 — dernier à 3'55";
  const estimate = isTest10k && result ? calcEstimateHtml(result) : '';
  return `
    <div class="session-result-box">
      <label class="session-note-label" for="session-result-${session.id}">⏱ Résultat</label>
      <input type="text" class="session-result-input"
        id="session-result-${session.id}"
        placeholder="${placeholder}"
        value="${escapeHtml(result)}"
        onclick="event.stopPropagation()"
        onkeydown="event.stopPropagation()"
        onblur="saveSessionResult('${session.id}', this.value)"
        ${isTest10k ? `oninput="updateSemiEstimate('${session.id}', this.value)"` : ''}>
      ${isTest10k ? `<div class="session-result-estimate${estimate ? ' visible' : ''}" id="result-estimate-${session.id}">${estimate}</div>` : ''}
    </div>
  `;
}

function saveSessionResult(id, value) {
  const next = String(value || '').trim();
  const prev = getSessionResult(id);
  if (next === prev) return;
  if (next) { sessionResults[id] = next; } else { delete sessionResults[id]; }
  save();
  updateResultIndicator(id);
  showToast('result-saved');
}

function updateSemiEstimate(id, value) {
  const el = document.getElementById(`result-estimate-${id}`);
  if (!el) return;
  const html = calcEstimateHtml(value);
  el.textContent = html.replace(/^→\s*/, '→ ');
  el.innerHTML = html;
  el.classList.toggle('visible', !!html);
}

function updateResultIndicator(id) {
  const card = document.getElementById(`week-card-${id}`);
  const name = card?.querySelector('.wsc-name');
  const expandIcon = name?.querySelector('.session-expand-icon');
  const existing = name?.querySelector('.result-indicator');
  const result = getSessionResult(id).trim();
  if (!name || !expandIcon) return;
  if (result && !existing) {
    expandIcon.insertAdjacentHTML('beforebegin', `<span class="result-indicator" title="Résultat">⏱ ${escapeHtml(result)}</span> `);
  } else if (result && existing) {
    existing.textContent = `⏱ ${result}`;
  } else if (!result && existing) {
    existing.remove();
  }
}

function getAllProgramSessions() {
  const sessions = [];
  for (let weekNum = 1; weekNum <= TOTAL_WEEKS; weekNum++) {
    const weekSessions = getWeekSessions(weekNum);
    Object.entries(weekSessions).forEach(([disciplineKey, items]) => {
      items.forEach(session => {
        sessions.push({ ...session, weekNum, disciplineKey });
      });
    });
  }
  return sessions;
}

function writeTextToClipboard(text) {
  if (navigator.clipboard?.writeText) {
    return navigator.clipboard.writeText(text);
  }
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.top = '-999px';
  document.body.appendChild(textarea);
  textarea.select();
  const copied = document.execCommand('copy');
  textarea.remove();
  return copied ? Promise.resolve() : Promise.reject(new Error('Clipboard unavailable'));
}

function copyAllSessionNotes() {
  const lines = getAllProgramSessions()
    .map(session => {
      const note = getSessionNote(session.id).trim();
      if (!note) return null;
      const discipline = DISCIPLINE_CONFIG[session.disciplineKey]?.label || 'Séance';
      return `Semaine ${getWeekLabel(session.weekNum)} · ${discipline} · ${getSessionDisplayName(session)}\n${note}`;
    })
    .filter(Boolean);

  if (!lines.length) {
    showToast('notes-empty');
    return;
  }

  writeTextToClipboard(lines.join('\n\n'))
    .then(() => showToast('notes-copied'))
    .catch(() => showToast('notes-error'));
}

// ═══════════════════════════════════════════════════
// EXPORT GARMIN .FIT (workout structuré pour la montre)
// Champs/valeurs vérifiés contre le Profile officiel du FIT SDK
// (mesg_num, field def #, base type, enums wkt_step_duration/target/intensity).
// ═══════════════════════════════════════════════════
const FIT_EPOCH_OFFSET_S = 631065600; // secondes entre 1970-01-01 et l'epoch FIT (1989-12-31)
const FIT_STEP_NAME_LEN = 32;
const FIT_WKT_NAME_LEN = 64;
const FIT_SPORT_BY_DISCIPLINE = { run: 1, bike: 2, swim: 5 };

const FIT_CRC_TABLE = [
  0x0000, 0xCC01, 0xD801, 0x1400, 0xF001, 0x3C00, 0x2800, 0xE401,
  0xA001, 0x6C00, 0x7800, 0xB401, 0x5000, 0x9C01, 0x8801, 0x4400
];

function fitCrc16(bytes) {
  let crc = 0;
  for (let i = 0; i < bytes.length; i++) {
    const byte = bytes[i];
    let tmp = FIT_CRC_TABLE[crc & 0xF];
    crc = ((crc >> 4) & 0x0FFF) ^ tmp ^ FIT_CRC_TABLE[byte & 0xF];
    tmp = FIT_CRC_TABLE[crc & 0xF];
    crc = ((crc >> 4) & 0x0FFF) ^ tmp ^ FIT_CRC_TABLE[(byte >> 4) & 0xF];
  }
  return crc;
}

function fitAsciiSafe(str, maxLen) {
  const stripped = String(str || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^\x20-\x7E]/g, '');
  return stripped.slice(0, maxLen);
}

function FitByteWriter() { this.bytes = []; }
FitByteWriter.prototype.u8 = function(v) { this.bytes.push(v & 0xFF); };
FitByteWriter.prototype.u16 = function(v) { this.bytes.push(v & 0xFF, (v >>> 8) & 0xFF); };
FitByteWriter.prototype.u32 = function(v) {
  this.bytes.push(v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF);
};
FitByteWriter.prototype.fixedString = function(str, len) {
  const ascii = fitAsciiSafe(str, len - 1);
  for (let i = 0; i < len; i++) this.bytes.push(i < ascii.length ? ascii.charCodeAt(i) : 0x00);
};

function fitWriteDefinition(w, localType, globalMesgNum, fields) {
  w.u8(0x40 | localType); // record header: définition, type local
  w.u8(0x00);             // reserved
  w.u8(0x00);             // architecture: little endian
  w.u16(globalMesgNum);
  w.u8(fields.length);
  fields.forEach(f => { w.u8(f.num); w.u8(f.size); w.u8(f.base); });
}

// ─── Parsing du contenu "sets" (texte du plan) vers des steps structurés ───

function fitParseSetDuration(distStr) {
  const s = String(distStr || '').trim();
  let m = s.match(/^(\d+)\s*×\s*(\d+)\s*(min|s|m)\b/);
  if (m) return { reps: parseInt(m[1], 10), value: parseInt(m[2], 10), unit: m[3] };
  m = s.match(/^(\d+)\s*(min|s|m)\b/);
  if (m) return { reps: 1, value: parseInt(m[1], 10), unit: m[2] };
  return null;
}

function fitParsePaceRangeMs(desc) {
  const m = String(desc || '').match(/(\d):(\d{2})[–-](\d):(\d{2})\/km/);
  if (!m) return null;
  const tA = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  const tB = parseInt(m[3], 10) * 60 + parseInt(m[4], 10);
  const speedA = 1000 / tA, speedB = 1000 / tB;
  return { low: Math.min(speedA, speedB), high: Math.max(speedA, speedB) };
}

function fitParseRecoverySeconds(desc) {
  const m = String(desc || '').match(/Récupération\s+(\d+)\s*(min|s)(?:\s+(\d+))?/i);
  if (!m) return null;
  if (m[2] === 'min') return parseInt(m[1], 10) * 60 + (m[3] ? parseInt(m[3], 10) : 0);
  return parseInt(m[1], 10);
}

const FIT_INTENSITY_BY_SET_TYPE = { warm: 2, main: 0, interval: 0, cool: 3 };

function fitMakeStep(opts) {
  return {
    name: opts.name || '',
    durationType: opts.durationType,
    durationValue: opts.durationValue || 0,
    targetType: opts.targetType != null ? opts.targetType : 2, // 2 = open
    targetValue: opts.targetValue || 0,
    customLow: opts.customLow || 0,
    customHigh: opts.customHigh || 0,
    intensity: opts.intensity != null ? opts.intensity : 0,
  };
}

// Convertit les "sets" d'une séance du plan en steps FIT (warmup/main/interval/cool),
// en dépliant les répétitions ("N × M min/m") en bloc [travail, récup?, repeat_until_steps_cmplt].
// Toute description non reconnue retombe sur un step "open" (avance manuelle) plutôt que de planter.
function buildFitStepsForSession(session) {
  const steps = [];

  (session.sets || []).forEach(set => {
    const parsed = fitParseSetDuration(set.dist);
    const intensity = FIT_INTENSITY_BY_SET_TYPE[set.type] != null ? FIT_INTENSITY_BY_SET_TYPE[set.type] : 0;
    const stepLabel = String(set.dist || set.type || '').trim();

    if (!parsed) {
      steps.push(fitMakeStep({ name: stepLabel, durationType: 5 /* open */, intensity }));
      return;
    }

    let durationType, durationValue;
    if (parsed.unit === 'm') {
      durationType = 1; // distance
      durationValue = Math.round(parsed.value * 100); // scale 100 -> cm
    } else {
      durationType = 0; // time
      const seconds = parsed.unit === 'min' ? parsed.value * 60 : parsed.value;
      durationValue = Math.round(seconds * 1000); // scale 1000 -> ms
    }

    const paceRange = fitParsePaceRangeMs(set.desc);
    let targetType = 2, targetValue = 0, customLow = 0, customHigh = 0;
    if (paceRange) {
      targetType = 0; // speed
      customLow = Math.round(paceRange.low * 1000);   // scale 1000 -> mm/s
      customHigh = Math.round(paceRange.high * 1000);
    }

    const workStep = fitMakeStep({ name: stepLabel, durationType, durationValue, targetType, targetValue, customLow, customHigh, intensity });

    if (parsed.reps > 1) {
      const workIndex = steps.length;
      steps.push(workStep);
      const recoverySec = fitParseRecoverySeconds(set.desc);
      if (recoverySec != null) {
        steps.push(fitMakeStep({
          name: 'Recuperation', durationType: 0, durationValue: Math.round(recoverySec * 1000),
          targetType: 2, intensity: 1 /* rest */,
        }));
      }
      steps.push(fitMakeStep({
        name: 'Repetition', durationType: 6 /* repeat_until_steps_cmplt */, durationValue: workIndex,
        targetType: 2, targetValue: parsed.reps, intensity: 0,
      }));
    } else {
      steps.push(workStep);
    }
  });

  steps.forEach((s, i) => { s.index = i; });
  return steps;
}

// ─── Encodage binaire du fichier .FIT ───

function encodeFitWorkout(steps, sportEnum, workoutName) {
  const w = new FitByteWriter();

  fitWriteDefinition(w, 0, 0 /* file_id */, [
    { num: 0, size: 1, base: 0x00 }, // type (enum)
    { num: 1, size: 2, base: 0x84 }, // manufacturer (uint16)
    { num: 2, size: 2, base: 0x84 }, // product (uint16)
    { num: 3, size: 4, base: 0x8C }, // serial_number (uint32z)
    { num: 4, size: 4, base: 0x86 }, // time_created (uint32/date_time)
  ]);
  w.u8(0x00); // data message, local type 0
  w.u8(5);         // file type = workout
  w.u16(255);       // manufacturer = development
  w.u16(0);         // product
  w.u32(1);         // serial_number
  w.u32(Math.floor(Date.now() / 1000) - FIT_EPOCH_OFFSET_S); // time_created

  fitWriteDefinition(w, 1, 26 /* workout */, [
    { num: 4, size: 1, base: 0x00 },              // sport (enum)
    { num: 6, size: 2, base: 0x84 },              // num_valid_steps (uint16)
    { num: 8, size: FIT_WKT_NAME_LEN, base: 0x07 }, // wkt_name (string)
  ]);
  w.u8(0x01); // data message, local type 1
  w.u8(sportEnum);
  w.u16(steps.length);
  w.fixedString(workoutName, FIT_WKT_NAME_LEN);

  fitWriteDefinition(w, 2, 27 /* workout_step */, [
    { num: 254, size: 2, base: 0x84 },               // message_index (uint16)
    { num: 0,   size: FIT_STEP_NAME_LEN, base: 0x07 }, // wkt_step_name (string)
    { num: 1,   size: 1, base: 0x00 },               // duration_type (enum)
    { num: 2,   size: 4, base: 0x86 },               // duration_value (uint32)
    { num: 3,   size: 1, base: 0x00 },               // target_type (enum)
    { num: 4,   size: 4, base: 0x86 },               // target_value (uint32)
    { num: 5,   size: 4, base: 0x86 },               // custom_target_value_low (uint32)
    { num: 6,   size: 4, base: 0x86 },               // custom_target_value_high (uint32)
    { num: 7,   size: 1, base: 0x00 },               // intensity (enum)
  ]);
  steps.forEach(step => {
    w.u8(0x02); // data message, local type 2
    w.u16(step.index);
    w.fixedString(step.name, FIT_STEP_NAME_LEN);
    w.u8(step.durationType);
    w.u32(step.durationValue);
    w.u8(step.targetType);
    w.u32(step.targetValue);
    w.u32(step.customLow);
    w.u32(step.customHigh);
    w.u8(step.intensity);
  });

  const header = new FitByteWriter();
  header.u8(12);   // header size
  header.u8(0x10); // protocol version 1.0
  header.u16(100); // profile version (arbitraire)
  header.u32(w.bytes.length);
  header.u8(0x2E); header.u8(0x46); header.u8(0x49); header.u8(0x54); // ".FIT"

  const fileBytes = header.bytes.concat(w.bytes);
  const crc = fitCrc16(fileBytes);
  fileBytes.push(crc & 0xFF, (crc >>> 8) & 0xFF);

  return new Uint8Array(fileBytes);
}

function exportSessionFit(id) {
  const session = getAllProgramSessions().find(s => s.id === id);
  if (!session) return;
  const disciplineKey = session.disciplineKey || getDiscipline(id);
  const sportEnum = FIT_SPORT_BY_DISCIPLINE[disciplineKey] != null ? FIT_SPORT_BY_DISCIPLINE[disciplineKey] : 0;

  const steps = buildFitStepsForSession(session);
  const bytes = encodeFitWorkout(steps, sportEnum, session.name);

  const blob = new Blob([bytes], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'HIPLAN-' + id + '.fit';
  a.click();
  URL.revokeObjectURL(url);
  showToast('fit-exported');
}
